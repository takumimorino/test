<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Othello | 2 Players</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#284d50,#11282c 65%);color:#f6f5e9;font-family:system-ui,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 12px 25px;text-align:center}.wrap{max-width:540px;margin:auto}.back{display:block;text-align:left;color:#b9dfd2;text-decoration:none;font-size:14px}h1{font-size:clamp(32px,8vw,46px);margin:16px 0 5px}p{font-size:13px;line-height:1.6;color:#d0e5dc}.scores{display:flex;justify-content:center;gap:14px;margin:18px auto}.player{border:2px solid #ffffff44;border-radius:14px;padding:12px 17px;min-width:130px;background:#ffffff10;font-weight:800}.player.active{border-color:#ffda72;box-shadow:0 0 0 2px #ffda7233}.disc{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:7px;box-shadow:inset -3px -4px 5px #0005}.black{background:#11151a;border:1px solid #677a7b}.white{background:#f7f8f0;border:1px solid #ccd3c9}.count{font-size:25px;margin-left:7px}.status{font-weight:900;min-height:48px;color:#ffe39a;line-height:1.5}.board{width:min(94vw,480px);aspect-ratio:1;margin:12px auto;display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #15392e;border-radius:8px;overflow:hidden;box-shadow:0 12px 35px #0006;background:#167451}.cell{position:relative;border:1px solid #0c503b;background:#21845c;padding:0;display:grid;place-items:center;min-width:0;cursor:pointer;touch-action:manipulation}.cell:focus-visible{outline:2px solid #fff;outline-offset:-3px}.piece{width:80%;height:80%;border-radius:50%;box-shadow:inset -4px -5px 7px #0005,0 2px 3px #0006}.piece.black{background:radial-gradient(circle at 30% 25%,#454d51,#101419 70%)}.piece.white{background:radial-gradient(circle at 30% 25%,#fff,#e4e7df 75%)}.hint{width:23%;height:23%;border-radius:50%;background:#e8f6cb8c;box-shadow:0 0 0 2px #e8f6cb55}button.reset{background:#ffd66e;color:#1a2b27;border:0;border-radius:12px;padding:13px 25px;font-size:16px;font-weight:900;margin-top:10px}.note{font-size:12px;color:#b5d1c7}</style></head><body><main class="wrap"><a class="back" href="index.html">← ゲーム選択へ</a><h1>⚫ OTHELLO ⚪</h1><p>1台のスマホで交互に対戦！<br>相手の石を挟んでひっくり返そう。</p><div class="scores"><div id="blackPlayer" class="player"><span class="disc black"></span>黒 <span class="count" id="blackCount">2</span></div><div id="whitePlayer" class="player"><span class="disc white"></span>白 <span class="count" id="whiteCount">2</span></div></div><div id="status" class="status" aria-live="polite"></div><div id="board" class="board" role="grid" aria-label="オセロ盤"></div><button id="reset" class="reset">最初から遊ぶ</button><p class="note">薄い丸が置ける場所です。置ける場所がないときは自動でパスします。</p></main><script>
(()=>{'use strict';const N=8,dirs=[-1,0,1].flatMap(dy=>[-1,0,1].filter(dx=>dx||dy).map(dx=>[dx,dy]));let board,turn,done;const el=document.getElementById('board'),status=document.getElementById('status');const inside=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
function flips(x,y,color){if(!inside(x,y)||board[y][x])return [];const all=[];for(const [dx,dy] of dirs){const chain=[];let a=x+dx,b=y+dy;while(inside(a,b)&&board[b][a]===-color){chain.push([a,b]);a+=dx;b+=dy;}if(chain.length&&inside(a,b)&&board[b][a]===color)all.push(...chain);}return all;}
function legal(color){const out=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(flips(x,y,color).length)out.push([x,y]);return out;}
function counts(){let black=0,white=0;for(const row of board)for(const v of row){if(v===1)black++;if(v===-1)white++;}return [black,white];}
function render(msg=''){const moves=done?[]:legal(turn),allowed=new Set(moves.map(([x,y])=>y*N+x));el.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',String.fromCharCode(65+x)+(y+1)+(board[y][x]===1?' 黒':board[y][x]===-1?' 白':allowed.has(y*N+x)?' 置けます':' 空き'));const v=board[y][x];if(v){const p=document.createElement('span');p.className='piece '+(v===1?'black':'white');cell.append(p);}else if(allowed.has(y*N+x)){const hint=document.createElement('span');hint.className='hint';cell.append(hint);cell.onclick=()=>play(x,y);}else cell.disabled=true;el.append(cell);}
const [b,w]=counts();document.getElementById('blackCount').textContent=b;document.getElementById('whiteCount').textContent=w;document.getElementById('blackPlayer').classList.toggle('active',!done&&turn===1);document.getElementById('whitePlayer').classList.toggle('active',!done&&turn===-1);if(done)status.textContent=b===w?'引き分け！ '+b+' 対 '+w:b>w?'⚫ 黒の勝ち！ '+b+' 対 '+w:'⚪ 白の勝ち！ '+w+' 対 '+b;else status.textContent=(msg?msg+'　':'')+(turn===1?'⚫ 黒':'⚪ 白')+'の番';}
function play(x,y){if(done)return;const taken=flips(x,y,turn);if(!taken.length)return;board[y][x]=turn;for(const [a,b] of taken)board[b][a]=turn;turn=-turn;let msg='';if(!legal(turn).length){const skipped=turn;turn=-turn;if(!legal(turn).length)done=true;else msg=(skipped===1?'黒':'白')+'は置けないためパス';}render(msg);}
function reset(){board=Array.from({length:N},()=>Array(N).fill(0));board[3][3]=-1;board[3][4]=1;board[4][3]=1;board[4][4]=-1;turn=1;done=false;render();}document.getElementById('reset').onclick=reset;reset();
})();
</script></body></html>
