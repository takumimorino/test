<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>⭕ Tic Tac Toe</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#131a32;color:white;font-family:system-ui,sans-serif;text-align:center;padding:calc(env(safe-area-inset-top) + 18px) 14px 24px}a{color:#b9d8ff}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 20px;font-weight:800}h1{margin:18px 0 8px}p{line-height:1.6}.wrap{max-width:500px;margin:auto}.back{display:block;text-align:left}.status{font-size:22px;font-weight:900;min-height:60px;margin:20px 0}.reset{background:#ffd447;color:#171a2d;margin:20px} .board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:390px;margin:22px auto}.cell{aspect-ratio:1;background:#263653;color:#fff;font-size:clamp(48px,15vw,82px);border:2px solid #526a8d;padding:0}.cell.x{color:#ff8fab}.cell.o{color:#75e5f4}.turn{color:#ffd447}</style></head><body><main class="wrap"><a class="back" href="index.html">← ゲーム選択</a><h1>⭕ Tic Tac Toe</h1><p>1台のスマホで交互にマスをタップ。<br>縦・横・斜めに3つ並べたら勝ち！</p><div id="status" class="status turn"></div><div id="board" class="board"></div><button id="reset" class="reset">もう一度</button></main><script>let cells=Array(9).fill(''),turn='X',over=false;const board=document.getElementById('board'),status=document.getElementById('status');const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){board.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell '+(v==='X'?'x':v==='O'?'o':'');b.textContent=v==='X'?'×':v==='O'?'○':'';b.setAttribute('aria-label',(i+1)+'番のマス');b.onclick=()=>play(i);board.append(b)});}function play(i){if(over||cells[i])return;cells[i]=turn;const won=wins.some(line=>line.every(j=>cells[j]===turn));if(won){status.textContent=(turn==='X'?'ピンク ×':'ブルー ○')+' の勝ち！';over=true;}else if(cells.every(Boolean)){status.textContent='引き分け！';over=true;}else{turn=turn==='X'?'O':'X';status.textContent=(turn==='X'?'ピンク ×':'ブルー ○')+' の番';}render();}function reset(){cells=Array(9).fill('');turn='X';over=false;status.textContent='ピンク × の番';render()}document.getElementById('reset').onclick=reset;reset();</script></body></html>
