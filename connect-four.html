<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🔴 Connect Four</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#131a32;color:white;font-family:system-ui,sans-serif;text-align:center;padding:calc(env(safe-area-inset-top) + 18px) 14px 24px}a{color:#b9d8ff}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 20px;font-weight:800}h1{margin:18px 0 8px}p{line-height:1.6}.wrap{max-width:500px;margin:auto}.back{display:block;text-align:left}.status{font-size:22px;font-weight:900;min-height:60px;margin:20px 0}.reset{background:#ffd447;color:#171a2d;margin:20px} .board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:#2467c9;border-radius:16px;padding:9px;margin:24px auto;max-width:470px}.hole{aspect-ratio:1;border-radius:50%;background:#111a31;border:2px solid #ffffff44;padding:0;min-width:0}.hole.red{background:#ff6287}.hole.yellow{background:#ffda4b}.hole:disabled{opacity:1}.status{color:#fff}</style></head><body><main class="wrap"><a class="back" href="index.html">← ゲーム選択</a><h1>🔴 Connect Four</h1><p>列をタップしてコマを落とそう！<br>縦・横・斜めに4つ並べたら勝ち。</p><div class="status" id="status"></div><div class="board" id="board"></div><button class="reset" id="reset">もう一度</button></main><script>let grid,turn,over;const board=document.getElementById('board'),status=document.getElementById('status');function reset(){grid=Array.from({length:6},()=>Array(7).fill(0));turn=1;over=false;status.textContent='🔴 赤の番';render()}function win(r,c){for(const [dr,dc] of [[1,0],[0,1],[1,1],[1,-1]]){let count=1;for(const sign of [-1,1]){let y=r+dr*sign,x=c+dc*sign;while(y>=0&&y<6&&x>=0&&x<7&&grid[y][x]===turn){count++;y+=dr*sign;x+=dc*sign;}}if(count>=4)return true;}return false;}function play(c){if(over)return;let r=5;while(r>=0&&grid[r][c])r--;if(r<0)return;grid[r][c]=turn;if(win(r,c)){over=true;status.textContent=(turn===1?'🔴 赤':'🟡 黄')+'の勝ち！';}else if(grid[0].every(Boolean)){over=true;status.textContent='引き分け！';}else{turn=3-turn;status.textContent=turn===1?'🔴 赤の番':'🟡 黄の番';}render();}function render(){board.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<7;c++){const b=document.createElement('button');b.className='hole '+(grid[r][c]===1?'red':grid[r][c]===2?'yellow':'');b.setAttribute('aria-label',(c+1)+'列');b.onclick=()=>play(c);board.append(b);}}document.getElementById('reset').onclick=reset;reset();</script></body></html>
