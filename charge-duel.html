<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Charge Fire Duel</title></head><body><script>(async()=>{try{const files=[1,2,3,4,5,6,7,8].map(n=>`charge-duel-parts/part${n}.b64`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:"no-store"});if(!r.ok)throw new Error(`Failed to load ${f}`);return r.text()}));const raw=atob(parts.join("").replace(/\s/g,""));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const html=new TextDecoder("utf-8").decode(bytes);document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<p style="font-family:sans-serif;padding:2rem">ゲームの読み込みに失敗しました。ページを再読み込みしてください。</p>'}})();</script></body></html>
