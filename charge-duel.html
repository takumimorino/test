<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Charge Fire Duel</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f172a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;touch-action:manipulation}body{min-height:100dvh}#game{height:100dvh;display:grid;grid-template-rows:1fr 130px 1fr;background:radial-gradient(circle at center,rgba(255,255,255,.05),transparent 35%),#0f172a}.player-zone{display:flex;justify-content:center;align-items:center;padding:14px;min-height:0}.player-top{border-bottom:1px solid rgba(255,255,255,.12)}.player-bottom{border-top:1px solid rgba(255,255,255,.12)}.player-content{width:min(700px,100%)}.player-top .player-content{transform:rotate(180deg)}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}.player-name{font-size:clamp(20px,5vw,30px);font-weight:900;letter-spacing:.05em}.score-line{margin-top:2px;font-size:13px;font-weight:900;color:#fde68a;letter-spacing:.05em}.status{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#cbd5e1}.status.selected{background:rgba(34,197,94,.18);color:#bbf7d0}.meter-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:12px;font-weight:900}.meter{display:flex;gap:5px;min-height:20px;overflow:hidden}.dot{width:14px;height:18px;flex:1 1 14px;max-width:18px;border-radius:5px;background:linear-gradient(145deg,#fde047,#f59e0b);box-shadow:0 0 10px rgba(245,158,11,.45)}.dot.empty{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);box-shadow:none}.charge-number{font-size:24px;min-width:30px;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{min-height:clamp(78px,12vh,110px);border:0;border-radius:18px;color:white;font:inherit;font-size:clamp(11px,3.2vw,18px);font-weight:900;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .08s,opacity .15s,filter .15s}.action:active:not(:disabled){transform:scale(.96)}.action .icon{font-size:clamp(22px,6vw,34px)}.action small{font-size:10px;opacity:.75}.charge-btn{background:linear-gradient(145deg,#ca8a04,#a16207)}.fire-btn{background:linear-gradient(145deg,#ef4444,#b91c1c)}.super-fire-btn{background:radial-gradient(circle at 50% 35%,#fff7ed 0 7%,#fb923c 8% 22%,#dc2626 42%,#7f1d1d 78%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 20px rgba(239,68,68,.28)}.barrier-btn{background:linear-gradient(145deg,#2563eb,#1d4ed8)}.counter-btn{background:linear-gradient(145deg,#10b981,#047857)}.super-counter-btn{background:radial-gradient(circle at 50% 35%,#ecfdf5 0 7%,#34d399 8% 22%,#059669 42%,#064e3b 78%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 20px rgba(16,185,129,.25)}.action:disabled{opacity:.25}.action.chosen{outline:4px solid white;outline-offset:-5px;filter:brightness(1.2)}.arena{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;gap:5px 12px;padding:10px 14px;background:#020617}.round{justify-self:end;color:#94a3b8;font-size:12px;font-weight:900}.timer-ring{grid-column:2;grid-row:1/span 2;width:88px;height:88px;padding:5px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff 360deg,rgba(255,255,255,.12) 0deg)}.timer-ring::before{content:"";grid-area:1/1;width:100%;height:100%;border-radius:50%;background:#020617}.timer{grid-area:1/1;z-index:1;font-weight:950;font-size:27px;font-variant-numeric:tabular-nums}.message{justify-self:start;font-weight:900;font-size:clamp(13px,3.5vw,18px)}.restart{grid-column:3;justify-self:end;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#cbd5e1;padding:8px 12px;border-radius:10px;font-weight:800}.reveal-overlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.88);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .08s ease}.reveal-overlay.show{opacity:1}.reveal-card{width:min(92vw,760px);text-align:center;transform:scale(.35);opacity:0}.reveal-overlay.show .reveal-card{animation:revealBoom .28s cubic-bezier(.17,.89,.32,1.35) forwards}@keyframes revealBoom{0%{transform:scale(.25) rotate(-5deg);opacity:0}70%{transform:scale(1.12) rotate(1deg);opacity:1}100%{transform:scale(1);opacity:1}}.reveal-title{font-size:clamp(22px,6vw,40px);font-weight:950;letter-spacing:.08em;margin-bottom:24px}.reveal-hands{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(10px,4vw,28px)}.reveal-hand{border-radius:28px;padding:clamp(18px,5vw,34px) clamp(12px,3vw,24px);background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18)}.reveal-player{font-size:clamp(14px,3.5vw,22px);font-weight:900;color:#cbd5e1;margin-bottom:10px}.reveal-icon{display:block;font-size:clamp(72px,20vw,150px);line-height:1}.reveal-name{margin-top:10px;font-size:clamp(18px,5vw,32px);font-weight:950}.reveal-vs{font-size:clamp(24px,7vw,50px);font-weight:1000;font-style:italic}.win-text{font-size:clamp(48px,15vw,110px);line-height:.95;font-weight:1000}.win-sub{margin-top:18px;font-size:clamp(18px,5vw,34px);font-weight:900;color:#fde68a}.reveal-overlay.superfire{background:radial-gradient(circle at center,rgba(127,29,29,.96),rgba(2,6,23,.98) 66%)}@media(max-height:680px){#game{grid-template-rows:1fr 100px 1fr}.player-zone{padding:8px 12px}.header{margin-bottom:6px}.meter-row{margin-bottom:7px}.action{min-height:62px;border-radius:14px}.timer-ring{width:68px;height:68px}.timer{font-size:21px}}@media(max-width:430px){.actions{gap:6px}.action{min-height:68px;padding:4px 2px;border-radius:13px}.action .icon{font-size:25px}.action small{font-size:8px}}
</style>
</head>
<body>
<main id="game">
<section class="player-zone player-top" id="player2"><div class="player-content"><div class="header"><div><div class="player-name">PLAYER 2</div><div class="score-line">SCORE <span id="p2score">0</span> / 10</div></div><div class="status" id="p2status">選択してください</div></div><div class="meter-row"><span>CHARGE</span><div class="meter" id="p2meter"></div><span class="charge-number" id="p2charge">0</span></div><div class="actions"><button class="action charge-btn" data-player="2" data-action="charge"><span class="icon">⚡</span><span>チャージ</span><small>+1</small></button><button class="action fire-btn" data-player="2" data-action="fire" disabled><span class="icon">🔥</span><span>ファイア</span><small>3消費</small></button><button class="action super-fire-btn" data-player="2" data-action="superfire" disabled><span class="icon">☄️</span><span>特大ファイア</span><small>10消費</small></button><button class="action barrier-btn" data-player="2" data-action="barrier"><span class="icon">🛡️</span><span>バリア</span><small>消費なし</small></button><button class="action counter-btn" data-player="2" data-action="counter" disabled><span class="icon">↩️</span><span>カウンター</span><small>1消費</small></button><button class="action super-counter-btn" data-player="2" data-action="supercounter" disabled><span class="icon">💥</span><span>特大カウンター</span><small>5消費</small></button></div></div></section>
<section class="arena"><div class="round" id="round">GAME 1 · ROUND 1</div><div class="timer-ring" id="timerRing"><div class="timer" id="timer">3.0</div></div><div class="message" id="message">SELECT</div><button class="restart" id="restart">最初から</button></section>
<section class="player-zone player-bottom" id="player1"><div class="player-content"><div class="header"><div><div class="player-name">PLAYER 1</div><div class="score-line">SCORE <span id="p1score">0</span> / 10</div></div><div class="status" id="p1status">選択してください</div></div><div class="meter-row"><span>CHARGE</span><div class="meter" id="p1meter"></div><span class="charge-number" id="p1charge">0</span></div><div class="actions"><button class="action charge-btn" data-player="1" data-action="charge"><span class="icon">⚡</span><span>チャージ</span><small>+1</small></button><button class="action fire-btn" data-player="1" data-action="fire" disabled><span class="icon">🔥</span><span>ファイア</span><small>3消費</small></button><button class="action super-fire-btn" data-player="1" data-action="superfire" disabled><span class="icon">☄️</span><span>特大ファイア</span><small>10消費</small></button><button class="action barrier-btn" data-player="1" data-action="barrier"><span class="icon">🛡️</span><span>バリア</span><small>消費なし</small></button><button class="action counter-btn" data-player="1" data-action="counter" disabled><span class="icon">↩️</span><span>カウンター</span><small>1消費</small></button><button class="action super-counter-btn" data-player="1" data-action="supercounter" disabled><span class="icon">💥</span><span>特大カウンター</span><small>5消費</small></button></div></div></section>
</main>
<div class="reveal-overlay" id="revealOverlay"><div class="reveal-card"><div class="reveal-title" id="revealTitle">RESULT</div><div class="reveal-hands" id="revealHands"><div class="reveal-hand"><div class="reveal-player">PLAYER 1</div><span class="reveal-icon" id="revealP1Icon">⚡</span><div class="reveal-name" id="revealP1Name">チャージ</div></div><div class="reveal-vs">VS</div><div class="reveal-hand"><div class="reveal-player">PLAYER 2</div><span class="reveal-icon" id="revealP2Icon">🛡️</span><div class="reveal-name" id="revealP2Name">バリア</div></div></div><div id="winPanel" style="display:none"><div class="win-text" id="winText">PLAYER 1<br>WIN!</div><div class="win-sub">勝利！</div></div></div></div>
<script>
const ROUND_SECONDS=3,FIRE_COST=3,SUPER_FIRE_COST=10,COUNTER_COST=1,SUPER_COUNTER_COST=5,MAX_CHARGE=10,MATCH_TARGET=10,REVEAL_SECONDS=1;
let charge={1:0,2:0},choice={1:null,2:null},score={1:0,2:0},roundNumber=1,gameNumber=1,gameOver=false,resolving=false,startedAt=performance.now(),intervalId=null;const $=id=>document.getElementById(id);
function resetGame(){charge={1:0,2:0};choice={1:null,2:null};score={1:0,2:0};roundNumber=1;gameNumber=1;gameOver=false;resolving=false;startedAt=performance.now();$("message").textContent="SELECT";hideReveal();if(intervalId)clearInterval(intervalId);intervalId=setInterval(tick,40);updateUI()}
function choose(player,action){if(gameOver||resolving)return;if(action==="fire"&&charge[player]<FIRE_COST)return;if(action==="superfire"&&charge[player]<SUPER_FIRE_COST)return;if(action==="counter"&&charge[player]<COUNTER_COST)return;if(action==="supercounter"&&charge[player]<SUPER_COUNTER_COST)return;choice[player]=action;updateUI()}
function tick(){if(gameOver||resolving)return;const elapsed=(performance.now()-startedAt)/1000,remain=Math.max(0,ROUND_SECONDS-elapsed);$("timer").textContent=remain.toFixed(1);$("timerRing").style.background=`conic-gradient(#fff ${(remain/ROUND_SECONDS)*360}deg,rgba(255,255,255,.12) 0deg)`;if(remain<=0)resolveRound()}
function showReveal(p1,p2){const d={charge:{icon:"⚡",name:"チャージ"},fire:{icon:"🔥",name:"ファイア"},superfire:{icon:"☄️",name:"特大ファイア"},barrier:{icon:"🛡️",name:"バリア"},counter:{icon:"↩️",name:"カウンター"},supercounter:{icon:"💥",name:"特大カウンター"}},o=$("revealOverlay");$("revealHands").style.display="grid";$("winPanel").style.display="none";$("revealTitle").textContent="RESULT";$("revealP1Icon").textContent=d[p1].icon;$("revealP1Name").textContent=d[p1].name;$("revealP2Icon").textContent=d[p2].icon;$("revealP2Name").textContent=d[p2].name;o.classList.toggle("superfire",["superfire","supercounter"].includes(p1)||["superfire","supercounter"].includes(p2));o.classList.add("show")}
function hideReveal(){$("revealOverlay").className="reveal-overlay"}
function showWinner(winner,points,matchWon){const o=$("revealOverlay");$("revealHands").style.display="none";$("winPanel").style.display="block";$("revealTitle").textContent=matchWon?"MATCH WINNER":"POINT!";$("winText").innerHTML=matchWon?`PLAYER ${winner}<br>WIN!`:`PLAYER ${winner}<br>+${points}`;document.querySelector(".win-sub").textContent=matchWon?`+${points} POINTS • SCORE ${score[winner]}`:`SCORE ${score[winner]} / ${MATCH_TARGET}`;o.classList.add("show")}
function resolveRound(){if(gameOver||resolving)return;resolving=true;if(choice[1]===null)choice[1]="barrier";if(choice[2]===null)choice[2]="barrier";const p1=choice[1],p2=choice[2];for(const [p,a] of [[1,p1],[2,p2]]){if(a==="fire")charge[p]-=FIRE_COST;if(a==="superfire")charge[p]-=SUPER_FIRE_COST;if(a==="counter")charge[p]-=COUNTER_COST;if(a==="supercounter")charge[p]-=SUPER_COUNTER_COST}let winner=null,winningAction=null;if(p1==="supercounter"&&["fire","superfire"].includes(p2)){winner=1;winningAction=p1}else if(p2==="supercounter"&&["fire","superfire"].includes(p1)){winner=2;winningAction=p2}else if(p1==="superfire"&&p2!=="superfire"&&p2!=="supercounter"){winner=1;winningAction=p1}else if(p2==="superfire"&&p1!=="superfire"&&p1!=="supercounter"){winner=2;winningAction=p2}else if(p1==="counter"&&p2==="fire"){winner=1;winningAction=p1}else if(p2==="counter"&&p1==="fire"){winner=2;winningAction=p2}else if(p1==="fire"&&p2==="charge"){winner=1;winningAction=p1}else if(p2==="fire"&&p1==="charge"){winner=2;winningAction=p2}showReveal(p1,p2);updateUI();setTimeout(()=>{hideReveal();if(winner!==null){awardPoint(winner,winningAction);return}if(p1==="charge")charge[1]=Math.min(MAX_CHARGE,charge[1]+1);if(p2==="charge")charge[2]=Math.min(MAX_CHARGE,charge[2]+1);roundNumber++;choice={1:null,2:null};resolving=false;startedAt=performance.now();$("message").textContent="SELECT";updateUI()},REVEAL_SECONDS*1000)}
function awardPoint(winner,winningAction){const points=["superfire","supercounter"].includes(winningAction)?5:1;score[winner]+=points;const matchWon=score[winner]>=MATCH_TARGET;showWinner(winner,points,matchWon);updateUI();if(matchWon){gameOver=true;resolving=false;clearInterval(intervalId);$("timer").textContent="WIN";$("message").textContent=`PLAYER ${winner} MATCH WIN!`;updateUI();return}setTimeout(()=>{hideReveal();charge={1:0,2:0};choice={1:null,2:null};roundNumber=1;gameNumber++;resolving=false;startedAt=performance.now();$("message").textContent="NEW GAME";updateUI()},1300)}
function updateUI(){$("round").textContent=`GAME ${gameNumber} · ROUND ${roundNumber}`;for(const player of [1,2]){$(`p${player}charge`).textContent=charge[player];$(`p${player}score`).textContent=score[player];const meter=$(`p${player}meter`);meter.innerHTML="";for(let i=0;i<MAX_CHARGE;i++){const dot=document.createElement("span");dot.className=i<charge[player]?"dot":"dot empty";meter.appendChild(dot)}const status=$(`p${player}status`);if(gameOver){status.textContent="ゲーム終了";status.classList.add("selected")}else if(choice[player]){status.textContent="選択中（変更可）";status.classList.add("selected")}else{status.textContent="選択してください";status.classList.remove("selected")}const zone=$(`player${player}`);zone.querySelectorAll(".action").forEach(btn=>{const action=btn.dataset.action;btn.classList.remove("chosen");if(gameOver||resolving)btn.disabled=true;else{if(action==="fire")btn.disabled=charge[player]<FIRE_COST;else if(action==="superfire")btn.disabled=charge[player]<SUPER_FIRE_COST;else if(action==="counter")btn.disabled=charge[player]<COUNTER_COST;else if(action==="supercounter")btn.disabled=charge[player]<SUPER_COUNTER_COST;else btn.disabled=false;if(action===choice[player])btn.classList.add("chosen")}})}}
document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.player),b.dataset.action)));$("restart").addEventListener("click",resetGame);resetGame();
</script>
</body>
</html>
