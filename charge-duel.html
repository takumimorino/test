<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Charge Fire Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#7bdff2;--cream:#fffaf0;--paper:#fff;--ink:#25213b;--soft:#665f7a;--pink:#ff5f9e;--yellow:#ffd447;--purple:#8b5cf6;--mint:#70e1b2;--blue:#4d96ff;--orange:#ff934f;--font-display:"Fredoka","Hiragino Kaku Gothic ProN",sans-serif;--font-body:"Nunito","Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--ink);font-family:var(--font-body);user-select:none;touch-action:manipulation}body{min-height:100dvh;background:var(--sky);position:relative}body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 8% 12%,rgba(255,255,255,.85) 0 5px,transparent 6px),radial-gradient(circle at 89% 17%,rgba(255,212,71,.95) 0 7px,transparent 8px),radial-gradient(circle at 15% 78%,rgba(255,95,158,.45) 0 9px,transparent 10px),radial-gradient(circle at 91% 83%,rgba(112,225,178,.78) 0 11px,transparent 12px),linear-gradient(145deg,#95e7f4,var(--sky) 42%,#8ed7ff);pointer-events:none}body::after{content:"★  ●  ✦  ●  ★";position:fixed;z-index:0;left:0;right:0;top:48%;color:rgba(255,255,255,.54);font-size:19px;letter-spacing:min(7vw,70px);text-align:center;pointer-events:none}#game{position:relative;z-index:1;height:100dvh;display:grid;grid-template-rows:1fr 126px 1fr;padding:10px;gap:10px}.player-zone{display:flex;justify-content:center;align-items:center;min-height:0}.player-content{width:min(720px,100%);background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:7px 8px 0 var(--ink);padding:14px 16px 15px;overflow:hidden;position:relative}.player-content::before{content:"✦";position:absolute;right:14px;bottom:9px;color:var(--pink);font-size:16px;transform:rotate(13deg);pointer-events:none}.player-top .player-content{transform:rotate(180deg)}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px}.player-name{font-family:var(--font-display);font-size:clamp(21px,5vw,30px);font-weight:700;letter-spacing:.025em;line-height:1}.score-line{display:inline-block;margin-top:5px;font-size:11px;font-weight:900;color:#6842d6;background:#eee7ff;border:2px solid var(--ink);border-radius:999px;padding:3px 8px;box-shadow:2px 2px 0 var(--ink)}.status{font-size:10px;padding:5px 8px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--soft);font-weight:900;box-shadow:2px 2px 0 #cfc6e8;white-space:nowrap}.status.selected{background:#ddf8ed;color:#167153;box-shadow:2px 2px 0 var(--mint)}.meter-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:10px;font-size:11px;font-weight:900;color:var(--soft)}.meter{display:flex;gap:4px;min-height:18px;overflow:hidden;background:#fff;border:2px solid var(--ink);border-radius:11px;padding:3px;box-shadow:3px 3px 0 #d6cced}.dot{height:11px;flex:1 1 11px;min-width:6px;border-radius:4px;background:var(--yellow);border:1px solid var(--ink)}.dot.empty{background:#eeeaf4;border-color:#cfc6e8}.charge-number{font-family:var(--font-display);font-size:22px;min-width:26px;text-align:center;color:var(--ink)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{min-height:clamp(68px,10vh,94px);border:3px solid var(--ink);border-radius:15px;color:var(--ink);font-family:var(--font-body);font-size:clamp(10px,2.8vw,15px);font-weight:900;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;cursor:pointer;box-shadow:4px 5px 0 var(--ink);transition:transform 110ms,box-shadow 110ms,filter 110ms;position:relative}.action:active:not(:disabled){transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}.action .icon{font-size:clamp(20px,5.5vw,31px);line-height:1.05}.action small{font-size:8px;font-weight:900;opacity:.68}.charge-btn{background:var(--yellow)}.fire-btn{background:#ff8b8b}.super-fire-btn{background:linear-gradient(145deg,#ffb46e,#ff6464 58%,#ff5f9e)}.barrier-btn{background:#91c7ff}.counter-btn{background:#9aebc9}.super-counter-btn{background:linear-gradient(145deg,#b8f5dd,#70e1b2 55%,#66c6ff)}.action:disabled{opacity:.28;filter:grayscale(.35);box-shadow:2px 2px 0 #827b91;cursor:not-allowed}.action.chosen{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:7px 7px 0 var(--pink);outline:3px solid #fff;outline-offset:-6px;filter:saturate(1.15)}.arena{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;gap:4px 10px;padding:8px 12px;background:var(--purple);border:4px solid var(--ink);border-radius:25px;box-shadow:6px 7px 0 var(--ink);color:#fff;position:relative;overflow:hidden}.arena::before{content:"● ✦ ●";position:absolute;left:15px;top:8px;color:rgba(255,255,255,.25);font-size:14px;letter-spacing:9px}.round{justify-self:end;color:#fff;font-size:10px;font-weight:900;letter-spacing:.03em;background:rgba(37,33,59,.28);border:2px solid var(--ink);border-radius:999px;padding:4px 7px}.timer-ring{grid-column:2;grid-row:1/span 2;width:78px;height:78px;padding:5px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--yellow) 360deg,rgba(255,255,255,.2) 0deg);box-shadow:4px 4px 0 var(--ink)}.timer-ring::before{content:"";grid-area:1/1;width:100%;height:100%;border-radius:50%;background:var(--cream)}.timer{grid-area:1/1;z-index:1;font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}.message{justify-self:start;font-family:var(--font-display);font-weight:700;font-size:clamp(12px,3vw,17px);color:var(--yellow);text-shadow:2px 2px 0 var(--ink)}.restart{grid-column:3;justify-self:end;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:6px 9px;border-radius:10px;font-family:var(--font-body);font-size:10px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}.restart:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.reveal-overlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(123,223,242,.88);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .08s ease;padding:18px}.reveal-overlay.show{opacity:1}.reveal-card{width:min(94vw,720px);text-align:center;background:var(--cream);border:5px solid var(--ink);border-radius:34px;box-shadow:11px 12px 0 var(--ink);padding:24px 18px 27px;transform:scale(.35) rotate(-4deg);opacity:0;position:relative;overflow:hidden}.reveal-card::before{content:"★";position:absolute;left:18px;top:15px;color:var(--pink);font-size:25px}.reveal-card::after{content:"✦";position:absolute;right:18px;bottom:14px;color:var(--yellow);font-size:25px}.reveal-overlay.show .reveal-card{animation:revealBoom .3s cubic-bezier(.17,.89,.32,1.35) forwards}@keyframes revealBoom{0%{transform:scale(.22) rotate(-7deg);opacity:0}72%{transform:scale(1.1) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-1deg);opacity:1}}.reveal-title{display:inline-block;font-family:var(--font-display);font-size:clamp(22px,6vw,38px);font-weight:700;letter-spacing:.06em;margin-bottom:19px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:5px 16px;box-shadow:4px 4px 0 var(--ink);color:var(--ink)}.reveal-hands{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,3vw,20px)}.reveal-hand{border-radius:23px;padding:clamp(14px,4vw,27px) 8px;background:#fff;border:3px solid var(--ink);box-shadow:5px 6px 0 #cfc6e8}.reveal-hand:first-child{box-shadow:5px 6px 0 var(--blue)}.reveal-hand:last-child{box-shadow:5px 6px 0 var(--pink)}.reveal-player{font-size:clamp(11px,3vw,18px);font-weight:900;color:#6842d6;margin-bottom:7px}.reveal-icon{display:block;font-size:clamp(60px,17vw,125px);line-height:1;filter:drop-shadow(3px 4px 0 rgba(37,33,59,.16))}.reveal-name{margin-top:8px;font-family:var(--font-display);font-size:clamp(15px,4.5vw,27px);font-weight:700;color:var(--ink)}.reveal-vs{font-family:var(--font-display);font-size:clamp(22px,6vw,43px);font-weight:700;color:var(--pink);text-shadow:2px 2px 0 var(--ink)}.win-text{font-family:var(--font-display);font-size:clamp(46px,14vw,100px);line-height:.95;font-weight:700;color:var(--pink);text-shadow:4px 4px 0 var(--yellow)}.win-sub{margin-top:16px;font-size:clamp(16px,4.5vw,29px);font-weight:900;color:#6842d6}.reveal-overlay.superfire{background:rgba(255,95,158,.78)}.reveal-overlay.superfire .reveal-card{box-shadow:11px 12px 0 var(--ink),0 0 0 10px rgba(255,212,71,.55)}@media(max-height:680px){#game{grid-template-rows:1fr 96px 1fr;padding:7px;gap:7px}.player-content{padding:9px 12px 10px;border-radius:22px}.header{margin-bottom:5px}.meter-row{margin-bottom:6px}.action{min-height:56px;border-radius:12px}.timer-ring{width:62px;height:62px}.timer{font-size:19px}.arena{border-radius:20px}}@media(max-width:430px){.actions{gap:5px}.action{min-height:62px;padding:3px 1px;border-width:2.5px;box-shadow:3px 4px 0 var(--ink)}.action .icon{font-size:22px}.action small{font-size:7px}.player-content{padding-left:10px;padding-right:10px}.meter{gap:2px}.reveal-card{padding-left:11px;padding-right:11px}}
</style>
</head>
<body>
<main id="game">
<section class="player-zone player-top" id="player2"><div class="player-content"><div class="header"><div><div class="player-name">PLAYER 2</div><div class="score-line">SCORE <span id="p2score">0</span> / 10</div></div><div class="status" id="p2status">選択してください</div></div><div class="meter-row"><span>CHARGE</span><div class="meter" id="p2meter"></div><span class="charge-number" id="p2charge">0</span></div><div class="actions"><button class="action charge-btn" data-player="2" data-action="charge"><span class="icon">⚡</span><span>チャージ</span><small>+1</small></button><button class="action fire-btn" data-player="2" data-action="fire" disabled><span class="icon">🔥</span><span>ファイア</span><small>3消費</small></button><button class="action super-fire-btn" data-player="2" data-action="superfire" disabled><span class="icon">☄️</span><span>特大ファイア</span><small>10消費</small></button><button class="action barrier-btn" data-player="2" data-action="barrier"><span class="icon">🛡️</span><span>バリア</span><small>消費なし</small></button><button class="action counter-btn" data-player="2" data-action="counter" disabled><span class="icon">↩️</span><span>カウンター</span><small>1消費</small></button><button class="action super-counter-btn" data-player="2" data-action="supercounter" disabled><span class="icon">💥</span><span>特大カウンター</span><small>5消費</small></button></div></div></section>
<section class="arena"><div class="round" id="round">GAME 1 · ROUND 1</div><div class="timer-ring" id="timerRing"><div class="timer" id="timer">3.0</div></div><div class="message" id="message">SELECT</div><button class="restart" id="restart">最初から</button></section>
<section class="player-zone player-bottom" id="player1"><div class="player-content"><div class="header"><div><div class="player-name">PLAYER 1</div><div class="score-line">SCORE <span id="p1score">0</span> / 10</div></div><div class="status" id="p1status">選択してください</div></div><div class="meter-row"><span>CHARGE</span><div class="meter" id="p1meter"></div><span class="charge-number" id="p1charge">0</span></div><div class="actions"><button class="action charge-btn" data-player="1" data-action="charge"><span class="icon">⚡</span><span>チャージ</span><small>+1</small></button><button class="action fire-btn" data-player="1" data-action="fire" disabled><span class="icon">🔥</span><span>ファイア</span><small>3消費</small></button><button class="action super-fire-btn" data-player="1" data-action="superfire" disabled><span class="icon">☄️</span><span>特大ファイア</span><small>10消費</small></button><button class="action barrier-btn" data-player="1" data-action="barrier"><span class="icon">🛡️</span><span>バリア</span><small>消費なし</small></button><button class="action counter-btn" data-player="1" data-action="counter" disabled><span class="icon">↩️</span><span>カウンター</span><small>1消費</small></button><button class="action super-counter-btn" data-player="1" data-action="supercounter" disabled><span class="icon">💥</span><span>特大カウンター</span><small>5消費</small></button></div></div></section>
</main>
<div class="reveal-overlay" id="revealOverlay"><div class="reveal-card"><div class="reveal-title" id="revealTitle">RESULT</div><div class="reveal-hands" id="revealHands"><div class="reveal-hand"><div class="reveal-player">PLAYER 1</div><span class="reveal-icon" id="revealP1Icon">⚡</span><div class="reveal-name" id="revealP1Name">チャージ</div></div><div class="reveal-vs">VS</div><div class="reveal-hand"><div class="reveal-player">PLAYER 2</div><span class="reveal-icon" id="revealP2Icon">🛡️</span><div class="reveal-name" id="revealP2Name">バリア</div></div></div><div id="winPanel" style="display:none"><div class="win-text" id="winText">PLAYER 1<br>WIN!</div><div class="win-sub">勝利！</div></div></div></div>
<script>
const ROUND_SECONDS=3,FIRE_COST=3,SUPER_FIRE_COST=10,COUNTER_COST=1,SUPER_COUNTER_COST=5,MAX_CHARGE=10,MATCH_TARGET=10,REVEAL_SECONDS=1;
let charge={1:0,2:0},choice={1:null,2:null},score={1:0,2:0},roundNumber=1,gameNumber=1,gameOver=false,resolving=false,startedAt=performance.now(),intervalId=null;const $=id=>document.getElementById(id);
function resetGame(){charge={1:0,2:0};choice={1:null,2:null};score={1:0,2:0};roundNumber=1;gameNumber=1;gameOver=false;resolving=false;startedAt=performance.now();$("message").textContent="SELECT";hideReveal();if(intervalId)clearInterval(intervalId);intervalId=setInterval(tick,40);updateUI()}
function choose(player,action){if(gameOver||resolving)return;if(action==="fire"&&charge[player]<FIRE_COST)return;if(action==="superfire"&&charge[player]<SUPER_FIRE_COST)return;if(action==="counter"&&charge[player]<COUNTER_COST)return;if(action==="supercounter"&&charge[player]<SUPER_COUNTER_COST)return;choice[player]=action;updateUI()}
function tick(){if(gameOver||resolving)return;const elapsed=(performance.now()-startedAt)/1000,remain=Math.max(0,ROUND_SECONDS-elapsed);$("timer").textContent=remain.toFixed(1);$("timerRing").style.background=`conic-gradient(var(--yellow) ${(remain/ROUND_SECONDS)*360}deg,rgba(255,255,255,.2) 0deg)`;if(remain<=0)resolveRound()}
function showReveal(p1,p2){const d={charge:{icon:"⚡",name:"チャージ"},fire:{icon:"🔥",name:"ファイア"},superfire:{icon:"☄️",name:"特大ファイア"},barrier:{icon:"🛡️",name:"バリア"},counter:{icon:"↩️",name:"カウンター"},supercounter:{icon:"💥",name:"特大カウンター"}},o=$("revealOverlay");$("revealHands").style.display="grid";$("winPanel").style.display="none";$("revealTitle").textContent="RESULT";$("revealP1Icon").textContent=d[p1].icon;$("revealP1Name").textContent=d[p1].name;$("revealP2Icon").textContent=d[p2].icon;$("revealP2Name").textContent=d[p2].name;o.classList.toggle("superfire",["superfire","supercounter"].includes(p1)||["superfire","supercounter"].includes(p2));o.classList.add("show")}
function hideReveal(){$("revealOverlay").className="reveal-overlay"}
function showWinner(winner,points,matchWon){const o=$("revealOverlay");$("revealHands").style.display="none";$("winPanel").style.display="block";$("revealTitle").textContent=matchWon?"MATCH WINNER":"POINT!";$("winText").innerHTML=matchWon?`PLAYER ${winner}<br>WIN!`:`PLAYER ${winner}<br>+${points}`;document.querySelector(".win-sub").textContent=matchWon?`+${points} POINTS • SCORE ${score[winner]}`:`SCORE ${score[winner]} / ${MATCH_TARGET}`;o.classList.add("show")}
function resolveRound(){if(gameOver||resolving)return;resolving=true;if(choice[1]===null)choice[1]="barrier";if(choice[2]===null)choice[2]="barrier";const p1=choice[1],p2=choice[2];for(const [p,a] of [[1,p1],[2,p2]]){if(a==="fire")charge[p]-=FIRE_COST;if(a==="superfire")charge[p]-=SUPER_FIRE_COST;if(a==="counter")charge[p]-=COUNTER_COST;if(a==="supercounter")charge[p]-=SUPER_COUNTER_COST}let winner=null,winningAction=null;if(p1==="supercounter"&&["fire","superfire"].includes(p2)){winner=1;winningAction=p1}else if(p2==="supercounter"&&["fire","superfire"].includes(p1)){winner=2;winningAction=p2}else if(p1==="superfire"&&p2!=="superfire"&&p2!=="supercounter"){winner=1;winningAction=p1}else if(p2==="superfire"&&p1!=="superfire"&&p1!=="supercounter"){winner=2;winningAction=p2}else if(p1==="counter"&&p2==="fire"){winner=1;winningAction=p1}else if(p2==="counter"&&p1==="fire"){winner=2;winningAction=p2}else if(p1==="fire"&&p2==="charge"){winner=1;winningAction=p1}else if(p2==="fire"&&p1==="charge"){winner=2;winningAction=p2}showReveal(p1,p2);updateUI();setTimeout(()=>{hideReveal();if(winner!==null){awardPoint(winner,winningAction);return}if(p1==="charge")charge[1]=Math.min(MAX_CHARGE,charge[1]+1);if(p2==="charge")charge[2]=Math.min(MAX_CHARGE,charge[2]+1);roundNumber++;choice={1:null,2:null};resolving=false;startedAt=performance.now();$("message").textContent="SELECT";updateUI()},REVEAL_SECONDS*1000)}
function awardPoint(winner,winningAction){const points=["superfire","supercounter"].includes(winningAction)?5:1;score[winner]+=points;const matchWon=score[winner]>=MATCH_TARGET;showWinner(winner,points,matchWon);updateUI();if(matchWon){gameOver=true;resolving=false;clearInterval(intervalId);$("timer").textContent="WIN";$("message").textContent=`PLAYER ${winner} MATCH WIN!`;updateUI();return}setTimeout(()=>{hideReveal();charge={1:0,2:0};choice={1:null,2:null};roundNumber=1;gameNumber++;resolving=false;startedAt=performance.now();$("message").textContent="NEW GAME";updateUI()},1300)}
function updateUI(){$("round").textContent=`GAME ${gameNumber} · ROUND ${roundNumber}`;for(const player of [1,2]){$(`p${player}charge`).textContent=charge[player];$(`p${player}score`).textContent=score[player];const meter=$(`p${player}meter`);meter.innerHTML="";for(let i=0;i<MAX_CHARGE;i++){const dot=document.createElement("span");dot.className=i<charge[player]?"dot":"dot empty";meter.appendChild(dot)}const status=$(`p${player}status`);if(gameOver){status.textContent="ゲーム終了";status.classList.add("selected")}else if(choice[player]){status.textContent="選択中（変更可）";status.classList.add("selected")}else{status.textContent="選択してください";status.classList.remove("selected")}const zone=$(`player${player}`);zone.querySelectorAll(".action").forEach(btn=>{const action=btn.dataset.action;btn.classList.remove("chosen");if(gameOver||resolving)btn.disabled=true;else{if(action==="fire")btn.disabled=charge[player]<FIRE_COST;else if(action==="superfire")btn.disabled=charge[player]<SUPER_FIRE_COST;else if(action==="counter")btn.disabled=charge[player]<COUNTER_COST;else if(action==="supercounter")btn.disabled=charge[player]<SUPER_COUNTER_COST;else btn.disabled=false;if(action===choice[player])btn.classList.add("chosen")}})}}
document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.player),b.dataset.action)));$("restart").addEventListener("click",resetGame);resetGame();
</script>
</body>
</html>
