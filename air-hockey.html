<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Air Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="duo.css?v=1">
<style>
  body.duo { touch-action: none; }
  #rink { display: block; width: 100cqw; height: 100cqh; touch-action: none; background: #eef8ff; }
</style>
</head>
<body>
<main class="duo-stage">
  <canvas id="rink" class="duo-card" aria-label="エアホッケーのリンク"></canvas>
</main>
<script src="duo.js?v=1"></script>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('rink'), ctx = cv.getContext('2d');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const COL = { ink: '#25213b', pink: '#ff5f9e', blue: '#4d96ff', yellow: '#ffd447', purple: '#8b5cf6', rink: '#eef8ff' };
  let W = 300, H = 500, dpr = 1, PR = 30, BR = 14, GOAL_W = 120;
  // paddles[0] = 手前（ピンク、下の半分）、paddles[1] = 奥（ブルー、上の半分）
  const paddles = [0, 1].map(i => ({ x: 0, y: 0, tx: 0, ty: 0, vx: 0, vy: 0, pid: null }));
  const puck = { x: 0, y: 0, vx: 0, vy: 0 };
  let points = [0, 0], target = 7, freeze = 0, trail = [], sparks = [], last = performance.now(), wallT = 0;

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    const ow = W, oh = H;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    PR = clamp(W * .085, 22, 42); BR = clamp(W * .042, 11, 20); GOAL_W = W * .42;
    const sx = W / ow, sy = H / oh;
    for (const p of paddles) { p.x *= sx; p.y *= sy; p.tx *= sx; p.ty *= sy; }
    puck.x *= sx; puck.y *= sy;
  }
  function home() {
    paddles[0].x = paddles[0].tx = W / 2; paddles[0].y = paddles[0].ty = H * .84;
    paddles[1].x = paddles[1].tx = W / 2; paddles[1].y = paddles[1].ty = H * .16;
    for (const p of paddles) { p.vx = p.vy = 0; p.pid = null; }
  }
  function placePuck(side) {
    puck.x = W / 2; puck.y = side === 0 ? H * .66 : side === 1 ? H * .34 : H / 2;
    puck.vx = puck.vy = 0; trail = [];
  }
  function reset(t) {
    target = +t; points = [0, 0];
    home(); placePuck(-1); freeze = 0;
    for (const i of [0, 1]) { duo.score(i, 0); duo.status(i, `${target}点先取`); }
  }
  // 自分の半分の中だけでパドルを動かせる
  function aim(i, x, y) {
    const p = paddles[i], m = 3;
    p.tx = clamp(x, PR + m, W - PR - m);
    p.ty = i === 0 ? clamp(y, H / 2 + PR, H - PR - m) : clamp(y, PR + m, H / 2 - PR);
  }
  const local = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left - cv.clientLeft, y: e.clientY - r.top - cv.clientTop }; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!duo.playing && duo.state !== 'countdown') return;
    const p = local(e), i = p.y > H / 2 ? 0 : 1;
    if (paddles[i].pid !== null) return;
    paddles[i].pid = e.pointerId; cv.setPointerCapture(e.pointerId); aim(i, p.x, p.y);
  });
  cv.addEventListener('pointermove', e => {
    const i = paddles.findIndex(p => p.pid === e.pointerId);
    if (i < 0) return;
    const p = local(e); aim(i, p.x, p.y);
  });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    cv.addEventListener(t, e => { for (const p of paddles) if (p.pid === e.pointerId) p.pid = null; });
  }

  function burst(x, y, color, n, sp) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, s = sp * (.4 + Math.random() * .8);
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .35 + Math.random() * .25, color });
    }
  }
  function goal(scorer) {
    points[scorer]++;
    duo.score(scorer, points[scorer]);
    duo.sfx.goal(); duo.buzz([40, 30, 80]);
    burst(puck.x, scorer === 0 ? 0 : H, scorer === 0 ? COL.blue : COL.pink, 30, 420);
    if (points[scorer] >= target) {
      placePuck(-1);
      return duo.end(scorer, `${Math.max(...points)} 対 ${Math.min(...points)}`, 1200);
    }
    duo.flash(scorer, 'GOAL!', `${points[scorer]} 点目`, scorer === 0 ? 'pink' : 'blue');
    duo.flash(1 - scorer, '失点…', '', 'gray');
    for (const i of [0, 1]) duo.status(i, points[i] === target - 1 ? 'マッチポイント！' : `${target}点先取`);
    placePuck(1 - scorer); freeze = .8;
  }
  function step(h) {
    for (const p of paddles) {
      const ox = p.x, oy = p.y, max = 3200 * h;
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      const k = d > max ? max / d : 1;
      p.x += dx * k; p.y += dy * k;
      p.vx = (p.x - ox) / h; p.vy = (p.y - oy) / h;
    }
    if (freeze > 0) { freeze -= h; return; }
    const damp = Math.exp(-.35 * h);
    puck.vx *= damp; puck.vy *= damp;
    puck.x += puck.vx * h; puck.y += puck.vy * h;
    const inMouth = Math.abs(puck.x - W / 2) < GOAL_W / 2 - BR * .3;
    if (puck.x < BR) { puck.x = BR; puck.vx = Math.abs(puck.vx) * .9; wallHit(); }
    if (puck.x > W - BR) { puck.x = W - BR; puck.vx = -Math.abs(puck.vx) * .9; wallHit(); }
    if (puck.y < BR && !inMouth) { puck.y = BR; puck.vy = Math.abs(puck.vy) * .9; wallHit(); }
    if (puck.y > H - BR && !inMouth) { puck.y = H - BR; puck.vy = -Math.abs(puck.vy) * .9; wallHit(); }
    if (puck.y < -BR) return goal(0);
    if (puck.y > H + BR) return goal(1);
    for (const p of paddles) {
      let dx = puck.x - p.x, dy = puck.y - p.y, dist = Math.hypot(dx, dy);
      const min = PR + BR;
      if (dist >= min) continue;
      if (dist < 1e-6) { dx = 0; dy = p === paddles[0] ? -1 : 1; dist = 1; }
      const nx = dx / dist, ny = dy / dist;
      puck.x = p.x + nx * min; puck.y = p.y + ny * min;
      // パドルの速さを打球に乗せる（相対速度で反射）
      const vr = (puck.vx - p.vx) * nx + (puck.vy - p.vy) * ny;
      if (vr < 0) {
        puck.vx -= 1.9 * vr * nx; puck.vy -= 1.9 * vr * ny;
        const power = clamp(-vr / 1400, .15, 1);
        duo.sfx.hit(power); burst(puck.x - nx * BR, puck.y - ny * BR, COL.yellow, 6 + (power * 10 | 0), 160 + power * 300);
      }
      puck.x = clamp(puck.x, BR, W - BR);
    }
    const vmax = clamp(H * 2.6, 900, 2200), v = Math.hypot(puck.vx, puck.vy);
    if (v > vmax) { puck.vx *= vmax / v; puck.vy *= vmax / v; }
  }
  function wallHit() { if (performance.now() - wallT > 60) { wallT = performance.now(); duo.sfx.hit(.1); } }

  function circle(x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function draw() {
    ctx.fillStyle = COL.rink; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(77,150,255,.12)';
    for (let y = 14; y < H; y += 24) for (let x = 14; x < W; x += 24) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
    // 陣地の色
    ctx.fillStyle = 'rgba(77,150,255,.08)'; ctx.fillRect(0, 0, W, H / 2);
    ctx.fillStyle = 'rgba(255,95,158,.08)'; ctx.fillRect(0, H / 2, W, H / 2);
    ctx.strokeStyle = COL.purple; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    circle(W / 2, H / 2, Math.min(W, H) * .17, null, COL.purple, 4);
    circle(W / 2, H / 2, 6, COL.purple);
    // ゴール前の半円とゴール口
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(77,150,255,.55)'; ctx.beginPath(); ctx.arc(W / 2, 0, GOAL_W / 2, 0, Math.PI); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,95,158,.55)'; ctx.beginPath(); ctx.arc(W / 2, H, GOAL_W / 2, Math.PI, Math.PI * 2); ctx.stroke();
    for (const [y, c] of [[0, COL.blue], [H - 10, COL.pink]]) {
      ctx.fillStyle = c; ctx.fillRect((W - GOAL_W) / 2, y, GOAL_W, 10);
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.strokeRect((W - GOAL_W) / 2, y, GOAL_W, 10);
    }
    // パックの軌跡
    for (let k = 0; k < trail.length; k++) {
      const t = trail[k], a = (k + 1) / trail.length;
      circle(t.x, t.y, BR * (.4 + .5 * a), `rgba(139,92,246,${.18 * a})`);
    }
    for (const s of sparks) circle(s.x, s.y, 3 * Math.max(.2, s.life / .6), s.color, COL.ink, 1);
    // パドル
    paddles.forEach((p, i) => {
      const c = i === 0 ? COL.pink : COL.blue;
      circle(p.x + 3, p.y + 5, PR, 'rgba(37,33,59,.28)');
      circle(p.x, p.y, PR, c, COL.ink, 4);
      circle(p.x, p.y, PR * .62, null, 'rgba(255,255,255,.55)', 4);
      circle(p.x, p.y, PR * .3, '#fff', COL.ink, 3);
    });
    // パック
    circle(puck.x + 2, puck.y + 4, BR, 'rgba(37,33,59,.3)');
    circle(puck.x, puck.y, BR, COL.ink);
    circle(puck.x, puck.y, BR * .62, null, COL.yellow, 3);
    if (freeze > 0) { ctx.globalAlpha = .5 + .5 * Math.sin(performance.now() / 90); circle(puck.x, puck.y, BR + 6, null, COL.yellow, 3); ctx.globalAlpha = 1; }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    if (duo.playing) {
      const n = Math.max(1, Math.ceil(dt / .004));
      for (let k = 0; k < n && duo.playing; k++) step(dt / n);
      trail.push({ x: puck.x, y: puck.y }); if (trail.length > 10) trail.shift();
    } else if (duo.state === 'countdown') {
      for (const p of paddles) { p.x = p.tx; p.y = p.ty; }
    }
    for (let k = sparks.length - 1; k >= 0; k--) {
      const s = sparks[k]; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .9; s.vy *= .9; s.life -= dt;
      if (s.life <= 0) sparks.splice(k, 1);
    }
    draw();
  }

  const duo = Duo({
    id: 'airhockey', title: 'AIR HOCKEY', realtime: true,
    rules: '自分の陣地の中で、指でパドルを動かそう。パドルを速く振るほど強く打てます。相手のゴールにパックを入れたら1点。',
    options: [{ key: 'target', label: '何点先取？', value: 7, choices: [[5, '5点'], [7, '7点'], [10, '10点']] }],
    onPrepare(opts, starter) { reset(opts.target); placePuck(-1); puck.vy = starter === 0 ? 160 : -160; },
    onStart() { last = performance.now(); },
    onResume() { last = performance.now(); },
    onMenu() { reset(duo.opts.target); }
  });
  new ResizeObserver(size).observe(cv);
  size(); home(); placePuck(-1);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
