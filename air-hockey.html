<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><title>Air Hockey | 2 Players</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10192c;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.topbar{position:absolute;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center}.back,.reset{pointer-events:auto;background:#ffffff22;border:1px solid #ffffff66;color:#fff;border-radius:12px;padding:9px 13px;font-weight:700;text-decoration:none;font-size:13px}.score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;letter-spacing:8px;text-shadow:0 2px 8px #000}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#071322a8;pointer-events:auto}.panel{max-width:310px;width:85%;text-align:center;padding:28px 20px;background:#1d2e48;border:2px solid #91ddff;border-radius:24px;box-shadow:0 12px 40px #0009}.panel h1{font-size:30px;margin:0 0 12px}.panel p{line-height:1.7;font-size:14px}.panel button{background:#ffd447;border:0;border-radius:14px;padding:13px 28px;font-size:18px;font-weight:900;margin-top:12px}.hidden{display:none!important}
</style></head><body><canvas id="rink"></canvas><div class="hud"><div class="topbar"><a class="back" href="index.html">← ゲーム選択</a><button class="reset" id="reset">リスタート</button></div><div class="score" id="score">0 : 0</div><div class="overlay" id="overlay"><div class="panel"><h1 id="heading">🏒 AIR HOCKEY</h1><p id="message">スマホの上下に分かれて対戦！<br>自分の陣地でパドルを指で動かそう。<br>先に7点で勝利！</p><button id="start">スタート</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('rink'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),start=document.getElementById('start');
let W=0,H=0,scale=1,playing=false,last=0,serve=0,points=[0,0],puck,players=[],pointers=new Map();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rand=(a,b)=>a+Math.random()*(b-a);
function size(){const oldW=W,oldH=H;W=innerWidth;H=innerHeight;scale=devicePixelRatio||1;canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);if(!players.length){players=[{x:W/2,y:H*.18,color:'#ff789d'},{x:W/2,y:H*.82,color:'#6be7ff'}];puck={x:W/2,y:H/2,vx:0,vy:0};}else{for(const p of players){p.x*=W/oldW;p.y*=H/oldH;}puck.x*=W/oldW;puck.y*=H/oldH;} }
const radius=()=>clamp(W*.075,21,35),ballR=()=>clamp(W*.034,11,17),goalW=()=>W*.43;
function resetPuck(dir){puck.x=W/2;puck.y=H/2;puck.vx=rand(-95,95);puck.vy=dir*clamp(H*.39,260,430);serve=.65;}
function newGame(){points=[0,0];players[0].x=players[1].x=W/2;players[0].y=H*.18;players[1].y=H*.82;scoreEl.textContent='0 : 0';resetPuck(Math.random()<.5?-1:1);playing=true;overlay.classList.add('hidden');last=performance.now();}
function show(title,msg,button){playing=false;heading.textContent=title;message.textContent=msg;start.textContent=button;overlay.classList.remove('hidden');}
start.addEventListener('click',newGame);document.getElementById('reset').addEventListener('click',()=>show('もう一度？','先に7点取った方が勝ち！','リスタート'));
function move(i,x,y){const r=radius(),half=H/2;players[i].x=clamp(x,r+5,W-r-5);players[i].y=i===0?clamp(y,r+54,half-r-6):clamp(y,half+r+6,H-r-12);}
function locate(e){const rect=canvas.getBoundingClientRect();return {x:e.clientX-rect.left,y:e.clientY-rect.top};}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;const p=locate(e),i=p.y<H/2?0:1;if([...pointers.values()].includes(i))return;pointers.set(e.pointerId,i);canvas.setPointerCapture(e.pointerId);move(i,p.x,p.y);});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const p=locate(e);move(pointers.get(e.pointerId),p.x,p.y);});
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>pointers.delete(e.pointerId));
function goal(i){points[i]++;scoreEl.textContent=points[0]+' : '+points[1];if(points[i]>=7){show(i===0?'上プレイヤーの勝利！':'下プレイヤーの勝利！','おめでとう！もう一度対戦しよう。','もう一度遊ぶ');return;}resetPuck(i===0?1:-1);}
function step(dt){if(!playing)return;if(serve>0){serve-=dt;return;}const br=ballR(),pr=radius();const ox=puck.x,oy=puck.y;puck.x+=puck.vx*dt;puck.y+=puck.vy*dt;
if(puck.x<br){puck.x=br;puck.vx=Math.abs(puck.vx);}if(puck.x>W-br){puck.x=W-br;puck.vx=-Math.abs(puck.vx);}
if(puck.y<br){if(Math.abs(puck.x-W/2)<goalW()/2){goal(1);return;}puck.y=br;puck.vy=Math.abs(puck.vy);}
if(puck.y>H-br){if(Math.abs(puck.x-W/2)<goalW()/2){goal(0);return;}puck.y=H-br;puck.vy=-Math.abs(puck.vy);}
for(const p of players){let dx=puck.x-p.x,dy=puck.y-p.y,dist=Math.hypot(dx,dy),min=br+pr;if(dist<min){if(dist<.001){dx=0;dy=p.y<H/2?1:-1;dist=1;}const nx=dx/dist,ny=dy/dist;puck.x=p.x+nx*(min+.5);puck.y=p.y+ny*(min+.5);const speed=clamp(Math.hypot(puck.vx,puck.vy)*1.045+25,310,Math.max(550,H*.85));puck.vx=nx*speed;puck.vy=ny*speed;}}
const max=clamp(H*.9,480,850),v=Math.hypot(puck.vx,puck.vy);if(v>max){puck.vx*=max/v;puck.vy*=max/v;}
}
function circle(x,y,r,fill,stroke,line=2){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}}
function draw(){ctx.fillStyle='#10253b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#162f4a';ctx.fillRect(9,9,W-18,H-18);ctx.strokeStyle='#8ddaff88';ctx.lineWidth=3;ctx.strokeRect(9,9,W-18,H-18);ctx.beginPath();ctx.moveTo(9,H/2);ctx.lineTo(W-9,H/2);ctx.stroke();circle(W/2,H/2,Math.min(W*.23,85),'#ffffff05','#8ddaff88',3);
const g=goalW();ctx.fillStyle='#ff789d';ctx.fillRect((W-g)/2,0,g,10);ctx.fillStyle='#6be7ff';ctx.fillRect((W-g)/2,H-10,g,10);
ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillStyle='#ffabc4';ctx.save();ctx.translate(W/2,H*.29);ctx.rotate(Math.PI);ctx.fillText('TOP PLAYER',0,0);ctx.restore();ctx.fillStyle='#a4f3ff';ctx.fillText('BOTTOM PLAYER',W/2,H*.71);
for(const p of players){circle(p.x,p.y,radius()+4,'#0005');circle(p.x,p.y,radius(),p.color,'#ffffffaa',3);circle(p.x,p.y,radius()*.52,'#ffffff55');}
circle(puck.x+2,puck.y+3,ballR()+2,'#0008');circle(puck.x,puck.y,ballR(),'#f7fbff','#85cfff',3);
}
function frame(now){const dt=Math.min((now-last)/1000||0,.035);last=now;const slices=Math.max(1,Math.ceil(dt/.008));for(let i=0;i<slices;i++)step(dt/slices);draw();requestAnimationFrame(frame);}
addEventListener('resize',size);size();requestAnimationFrame(frame);
})();
</script></body></html>
