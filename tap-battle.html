<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>⚡ Tap Battle</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#131a32;color:white;font-family:system-ui,sans-serif;text-align:center;padding:calc(env(safe-area-inset-top) + 18px) 14px 24px}a{color:#b9d8ff}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 20px;font-weight:800}h1{margin:18px 0 8px}p{line-height:1.6}.wrap{max-width:500px;margin:auto}.back{display:block;text-align:left}.status{font-size:22px;font-weight:900;min-height:60px;margin:20px 0}.reset{background:#ffd447;color:#171a2d;margin:20px} .arena{height:min(65dvh,600px);min-height:370px;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:3px solid #fff4;margin:15px auto;touch-action:manipulation}.zone{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;user-select:none;touch-action:manipulation;font-weight:900;font-size:27px;cursor:pointer}.zone strong{font-size:62px}.top{background:#a83e69;transform:rotate(180deg)}.bottom{background:#197a9a}.middle{background:#111b35;padding:9px;font-size:21px;font-weight:900}.zone:active{filter:brightness(1.2)}.status{min-height:35px;margin:8px}</style></head><body><main class="wrap"><a class="back" href="index.html">← ゲーム選択</a><h1>⚡ Tap Battle</h1><p>スマホの上下で連打勝負！<br>10秒間で多くタップした人が勝ち。</p><div id="status" class="status">スタートを押して準備！</div><div class="arena"><div id="top" class="zone top">上プレイヤー<strong id="a">0</strong>連打！</div><div id="timer" class="middle">10.0 秒</div><div id="bottom" class="zone bottom">下プレイヤー<strong id="b">0</strong>連打！</div></div><button class="reset" id="start">スタート</button></main><script>let score=[0,0],running=false,end=0,raf=0;const status=document.getElementById('status'),timer=document.getElementById('timer'),start=document.getElementById('start');function hit(i){if(!running)return;score[i]++;document.getElementById(i===0?'a':'b').textContent=score[i];}document.getElementById('top').addEventListener('pointerdown',e=>{e.preventDefault();hit(0)});document.getElementById('bottom').addEventListener('pointerdown',e=>{e.preventDefault();hit(1)});function tick(){const remain=Math.max(0,(end-performance.now())/1000);timer.textContent=remain.toFixed(1)+' 秒';if(remain<=0){running=false;status.textContent=score[0]===score[1]?'引き分け！':score[0]>score[1]?'上プレイヤーの勝利！':'下プレイヤーの勝利！';start.textContent='もう一度';return;}raf=requestAnimationFrame(tick)}start.onclick=()=>{cancelAnimationFrame(raf);score=[0,0];document.getElementById('a').textContent='0';document.getElementById('b').textContent='0';running=true;end=performance.now()+10000;status.textContent='連打スタート！';start.textContent='やり直す';tick()};</script></body></html>
