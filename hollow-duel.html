<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Hollow Duel — 2P FPS</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d121a;color:#eee5d6;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#overlay{position:fixed;inset:0;background:#080e17e9;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:5}#overlay.hide{display:none}.panel{max-width:340px;border:2px solid #ffae3b;background:#1b2632;padding:26px;border-radius:12px}h1{color:#ffae3b;margin:0;font-size:32px}p{font-size:14px;line-height:1.7}button{border:0;background:#ffae3b;color:#171717;padding:14px 25px;border-radius:8px;font-weight:900;font-size:17px}a{color:#a9c4db}.bar{position:fixed;top:50%;left:0;right:0;height:3px;background:#ffae3b;pointer-events:none}.label{position:fixed;left:8px;font-size:12px;font-weight:900;color:#fff;background:#111b26a9;padding:4px 7px;pointer-events:none}.top{top:8px;transform:rotate(180deg)}.bottom{top:calc(50% + 7px)}.controls{position:fixed;inset:0;pointer-events:none}.zone{position:absolute;left:0;width:100%;height:50%;pointer-events:none}.zone.up{top:0;transform:rotate(180deg)}.zone.down{bottom:0}.pad{position:absolute;bottom:8%;left:5%;width:96px;height:96px;border:2px solid #ffffff66;border-radius:50%;pointer-events:auto;touch-action:none;background:#ffffff13}.knob{position:absolute;left:31px;top:31px;width:30px;height:30px;border-radius:50%;background:#fff9}.fire,.reload{position:absolute;bottom:12%;right:5%;width:72px;height:72px;border-radius:50%;background:#f36a45bb;color:white;border:2px solid #ffbd90;pointer-events:auto;touch-action:none;font-size:13px}.reload{bottom:5%;right:29%;width:47px;height:47px;background:#56687cbb;border-color:#b7c4d4;font-size:10px}.hint{position:absolute;bottom:2%;left:37%;font-size:10px;color:#ffffff99;pointer-events:none}</style></head><body><canvas id="view"></canvas><div class="bar"></div><div class="label top" id="topScore">P1 HP 100 | 12/12 | 0 KILLS</div><div class="label bottom" id="bottomScore">P2 HP 100 | 12/12 | 0 KILLS</div><div class="controls" id="controls"></div><div id="overlay"><div class="panel"><h1 id="title">HOLLOW DUEL</h1><p id="desc">Hollow Range風の廃墟アリーナで2人対戦！<br>スマホの上下で画面を分割。<br>左のスティックで前後移動・旋回、右のFIREで射撃。RELOADで装填。<br>先に5キルで勝利！</p><button id="start">対戦スタート</button><p><a href="index.html">← ゲーム選択へ</a></p></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),controls=document.getElementById('controls'),topScore=document.getElementById('topScore'),bottomScore=document.getElementById('bottomScore');
const map=['111111111111','100000000001','101000010001','100000000001','100010000101','100000000001','100000000001','101000010001','100000000001','111111111111'],MW=12,MH=10;let W=0,H=0,dpr=1,run=false,last=0,players=[],inputs=[],fx=[];
function wall(x,y){const ix=Math.floor(x),iy=Math.floor(y);return iy<0||iy>=MH||ix<0||ix>=MW||map[iy][ix]==='1';}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize);resize();
function init(){players=[{x:2,y:2,a:.3,hp:100,ammo:12,kills:0,flash:0,reload:0,inv:0},{x:9,y:7,a:Math.PI+.3,hp:100,ammo:12,kills:0,flash:0,reload:0,inv:0}];inputs=[{f:0,t:0,shoot:false},{f:0,t:0,shoot:false}];fx=[0,0];}
function clear(i){const p=players[i];p.x=i===0?2:9;p.y=i===0?2:7;p.a=i===0?.3:Math.PI+.3;p.hp=100;p.ammo=12;p.reload=0;p.inv=1.5;}
function cast(x,y,a){const dx=Math.cos(a),dy=Math.sin(a);let dist=0;while(dist<17){dist+=.035;if(wall(x+dx*dist,y+dy*dist))break;}return dist;}
function shoot(i){const p=players[i],q=players[1-i];if(!run||p.reload>0||p.ammo<=0||p.flash>0)return;p.ammo--;p.flash=.23;let angle=Math.atan2(q.y-p.y,q.x-p.x)-p.a;angle=Math.atan2(Math.sin(angle),Math.cos(angle));const dist=Math.hypot(q.x-p.x,q.y-p.y);if(Math.abs(angle)<Math.atan2(.32,dist)&&cast(p.x,p.y,p.a)>dist-.25&&q.inv<=0){q.hp-=34;fx[1-i]=.35;if(q.hp<=0){p.kills++;clear(1-i);if(p.kills>=5){run=false;document.getElementById('title').textContent='PLAYER '+(i+1)+' WINS';document.getElementById('desc').textContent='5キル達成！もう一度対戦しよう。';document.getElementById('start').textContent='再戦する';overlay.classList.remove('hide');}}}}
function reload(i){const p=players[i];if(p.ammo<12&&p.reload<=0)p.reload=1.25;}
function setup(){controls.innerHTML='';for(let i=0;i<2;i++){const z=document.createElement('div');z.className='zone '+(i===0?'up':'down');z.innerHTML='<div class="pad"><div class="knob"></div></div><button class="fire">FIRE</button><button class="reload">RELOAD</button><span class="hint">MOVE / TURN</span>';controls.append(z);const pad=z.querySelector('.pad'),knob=z.querySelector('.knob');let id=null;function adjust(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/38,dy=(e.clientY-cy)/38;if(i===0){dx=-dx;dy=-dy;}const m=Math.max(1,Math.hypot(dx,dy));dx/=m;dy/=m;inputs[i].t=dx;inputs[i].f=-dy;knob.style.transform='translate('+dx*29+'px,'+(-dy)*29+'px)';}pad.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;pad.setPointerCapture(id);adjust(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===id)adjust(e)});function stop(e){if(e.pointerId!==id)return;id=null;inputs[i].f=inputs[i].t=0;knob.style.transform='';}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);const fire=z.querySelector('.fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();fire.setPointerCapture(e.pointerId);inputs[i].shoot=true;shoot(i)});for(const ev of ['pointerup','pointercancel'])fire.addEventListener(ev,()=>inputs[i].shoot=false);z.querySelector('.reload').addEventListener('pointerdown',e=>{e.preventDefault();reload(i)});}}
function update(dt){if(!run)return;for(let i=0;i<2;i++){const p=players[i],c=inputs[i];p.a+=c.t*2.5*dt;const speed=2.6*dt*c.f,nx=p.x+Math.cos(p.a)*speed,ny=p.y+Math.sin(p.a)*speed;if(!wall(nx+.2*Math.sign(speed||1),p.y)&&!wall(nx-.2*Math.sign(speed||1),p.y))p.x=nx;if(!wall(p.x,ny+.2*Math.sign(speed||1))&&!wall(p.x,ny-.2*Math.sign(speed||1)))p.y=ny;p.flash=Math.max(0,p.flash-dt);p.inv=Math.max(0,p.inv-dt);if(p.reload>0){p.reload-=dt;if(p.reload<=0)p.ammo=12;}if(c.shoot)shoot(i);fx[i]=Math.max(0,fx[i]-dt);}}
function render(i){const p=players[i],q=players[1-i],h=H/2,y0=i===0?0:h;ctx.save();ctx.beginPath();ctx.rect(0,y0,W,h);ctx.clip();if(i===0){ctx.translate(W,h);ctx.rotate(Math.PI);}ctx.fillStyle='#263749';ctx.fillRect(0,y0,W,h/2);ctx.fillStyle='#35332e';ctx.fillRect(0,y0+h/2,W,h/2);const fov=1.12,step=Math.max(2,Math.floor(W/190)),z=[];for(let sx=0;sx<W;sx+=step){const angle=p.a+Math.atan((sx/W-.5)*2*Math.tan(fov/2)),dist=cast(p.x,p.y,angle)*Math.cos(angle-p.a),height=Math.min(h*2,h/(dist*.68)),shade=Math.max(28,165-dist*18);ctx.fillStyle='rgb('+Math.round(shade*.77)+','+Math.round(shade*.83)+','+Math.round(shade*.9)+')';ctx.fillRect(sx,y0+(h-height)/2,step+1,height);z[Math.floor(sx/step)]=dist;}
const dx=q.x-p.x,dy=q.y-p.y,dist=Math.hypot(dx,dy);let a=Math.atan2(dy,dx)-p.a;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)<fov*.7){const center=W/2+Math.tan(a)/Math.tan(fov/2)*W/2,bh=Math.min(h*.85,h/(dist*.8)),bw=bh*.42;if(dist<(z[Math.max(0,Math.min(z.length-1,Math.floor(center/step)))]||20)+.1){ctx.fillStyle=q.inv>0?'#e7e7e799':'#ff6b53';ctx.fillRect(center-bw/2,y0+(h-bh)/2,bw,bh);ctx.fillStyle='#181f2a';ctx.fillRect(center-bw*.3,y0+(h-bh)/2+bh*.15,bw*.6,bh*.18);}}
ctx.strokeStyle='#ffffffb0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-12,y0+h/2);ctx.lineTo(W/2-4,y0+h/2);ctx.moveTo(W/2+4,y0+h/2);ctx.lineTo(W/2+12,y0+h/2);ctx.moveTo(W/2,y0+h/2-12);ctx.lineTo(W/2,y0+h/2-4);ctx.moveTo(W/2,y0+h/2+4);ctx.lineTo(W/2,y0+h/2+12);ctx.stroke();
ctx.fillStyle='#141a20';ctx.fillRect(W*.41,y0+h*.84,W*.18,h*.23);ctx.fillStyle='#8996a0';ctx.fillRect(W*.465,y0+h*.75,W*.07,h*.19);if(p.flash>0){ctx.fillStyle='#ffdc79';ctx.beginPath();ctx.arc(W/2,y0+h*.73,20+p.flash*55,0,Math.PI*2);ctx.fill();}
if(fx[i]>0){ctx.fillStyle='rgba(255,50,35,'+(fx[i]*.7)+')';ctx.fillRect(0,y0,W,h);}ctx.restore();}
function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);if(players.length){render(0);render(1);topScore.textContent='P1 HP '+players[0].hp+' | '+(players[0].reload>0?'RELOAD':players[0].ammo+'/12')+' | '+players[0].kills+' KILLS';bottomScore.textContent='P2 HP '+players[1].hp+' | '+(players[1].reload>0?'RELOAD':players[1].ammo+'/12')+' | '+players[1].kills+' KILLS';}requestAnimationFrame(frame);}
document.getElementById('start').onclick=()=>{init();setup();run=true;overlay.classList.add('hide');last=performance.now();};init();requestAnimationFrame(frame);
})();
</script></body></html>
