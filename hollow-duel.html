<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hollow Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root {
    --bg: #0e1319;
    --ink: #ece6d8;
    --muted: #8d9aa6;
    --p1: #ffae3b;
    --p2: #55e0b8;
    --alarm: #ff4a3d;
    --line: rgba(236, 230, 216, .16);
    --glass: rgba(12, 16, 22, .55);
    --display: "Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", "BIZ UDPGothic", ui-monospace, Menlo, monospace;
    --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game, #game canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* 画面の上半分は奥側の人（ミント）用。180°回して、向かい合った位置から正しく見えるようにする */
  .half { position: fixed; left: 0; right: 0; height: 50%; overflow: hidden; pointer-events: none; }
  .half.p1 { bottom: 0; --edge: env(safe-area-inset-bottom, 0px); --c: var(--p1); --fc: var(--p2); }
  .half.p2 { top: 0; transform: rotate(180deg); --edge: env(safe-area-inset-top, 0px); --c: var(--p2); --fc: var(--p1); }
  .seam { position: fixed; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(236, 230, 216, .55); pointer-events: none; z-index: 2; }

  .hud { position: absolute; inset: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .lbl { font-family: var(--body); font-weight: 700; font-size: 10px; letter-spacing: .12em; color: var(--muted); }
  .score { position: absolute; top: 10px; left: 12px; display: flex; align-items: baseline; gap: 6px; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; }
  .score .me { color: var(--c); }
  .score .foe { color: var(--fc); }
  .score .sep { color: var(--muted); font-size: 22px; }
  .score .goal { font-family: var(--body); font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin-left: 4px; }
  .hpbox { position: absolute; top: 48px; left: 12px; display: flex; align-items: center; gap: 8px; }
  .hpwrap { width: 104px; height: 8px; background: rgba(236, 230, 216, .14); }
  .hpbar { height: 100%; width: 100%; background: var(--ink); transition: width .12s;
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); mask: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); }
  .hpbar.low { background: var(--alarm); }
  .hpnum { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; min-width: 3ch; }
  .ammo { position: absolute; top: 10px; right: 98px; text-align: right; }
  .ammo-n { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; }
  .ammo-n.empty { color: var(--alarm); }
  .ammo-m { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .ammo-s { font-family: var(--body); font-weight: 700; font-size: 10px; color: var(--c); min-height: 1em; }
  .radar { position: absolute; top: 8px; right: 10px; width: 80px; height: 80px; }

  .xhair { position: absolute; left: 50%; top: 50%; --gap: 8px; }
  .xhair i { position: absolute; background: var(--ink); box-shadow: 0 0 0 1px rgba(0,0,0,.45); transition: opacity .12s; }
  .xhair i:nth-child(1) { width: 2px; height: 8px; left: -1px; top: calc(-1 * var(--gap) - 8px); }
  .xhair i:nth-child(2) { width: 2px; height: 8px; left: -1px; top: var(--gap); }
  .xhair i:nth-child(3) { width: 8px; height: 2px; top: -1px; left: calc(-1 * var(--gap) - 8px); }
  .xhair i:nth-child(4) { width: 8px; height: 2px; top: -1px; left: var(--gap); }
  .xhair b { position: absolute; width: 2px; height: 2px; left: -1px; top: -1px; background: var(--c); }
  .xhair.aim i { opacity: 0; }
  .hitm { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: 0; transition: opacity .12s; }
  .hitm::before, .hitm::after { content: ""; position: absolute; left: 10px; top: -2px; width: 2px; height: 26px; background: var(--ink);
    -webkit-mask: linear-gradient(#000 0 35%, transparent 35% 65%, #000 65%); mask: linear-gradient(#000 0 35%, transparent 35% 65%, #000 65%); }
  .hitm::before { transform: rotate(45deg); }
  .hitm::after { transform: rotate(-45deg); }
  .hitm.on { opacity: 1; transition: none; }
  .hitm.weak::before, .hitm.weak::after { background: var(--c); }
  .hitm.kill { transform: scale(1.4); }
  .hitm.kill::before, .hitm.kill::after { background: var(--alarm); }

  .banner { position: absolute; left: 0; right: 0; top: 28%; text-align: center; opacity: 0; padding-inline: 12px; }
  .banner.show { animation: banner 1.8s ease-out forwards; }
  .bT { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 14vw, 88px); line-height: .9; color: var(--c); letter-spacing: .04em; }
  .bS { font-family: var(--body); font-weight: 700; font-size: 13px; letter-spacing: .1em; margin-top: 8px; }
  @keyframes banner { 0% { opacity: 0; transform: scale(1.15); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
  .talk { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: calc(100% - 24px); max-width: 460px; display: flex; gap: 8px; align-items: baseline;
    padding: 6px 10px; background: rgba(6, 12, 11, .82); border: 1px solid rgba(85, 224, 184, .35); border-radius: 4px; font-family: var(--body);
    opacity: 0; transition: opacity .25s; }
  .talk.on { opacity: 1; }
  .talk .who { font-weight: 700; font-size: 10px; letter-spacing: .14em; color: var(--p2); flex: none; }
  .talk .txt { font-size: 13px; line-height: 1.5; }

  .vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 60, 40, .55) 100%); }
  .dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  .dmgdir::before { content: ""; position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    border-top: 4px solid var(--alarm); border-right: 4px solid transparent; border-left: 4px solid transparent;
    -webkit-mask: conic-gradient(from -30deg, #000 0 60deg, transparent 60deg); mask: conic-gradient(from -30deg, #000 0 60deg, transparent 60deg); }
  .dead { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; background: rgba(48, 6, 6, .42); }
  .dead-t { font-weight: 700; font-size: 22px; }
  .dead-s { font-family: var(--mono); font-size: 13px; color: var(--muted); }

  /* 操作ボタン。右側のボタン群は少し持ち上げて、手前の右下を視点操作用に空けておく */
  .ctl { position: absolute; inset: 0; pointer-events: none; }
  body:not(.touch) .ctl { display: none; }
  .half { --s: 1; }
  body.tablet .half { --s: 1.25; }
  .stick { position: absolute; left: 14px; bottom: calc(var(--edge) + 18px); width: calc(108px * var(--s)); height: calc(108px * var(--s)); border-radius: 50%;
    border: 1px solid var(--line); background: var(--glass); pointer-events: auto; touch-action: none; }
  .stick.float { opacity: .85; }
  .knob { position: absolute; left: 50%; top: 50%; width: calc(48px * var(--s)); height: calc(48px * var(--s)); margin: calc(-24px * var(--s)); border-radius: 50%; background: rgba(236, 230, 216, .3); }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 1px solid var(--line); background: var(--glass);
    color: var(--ink); font: 700 11px/1.2 var(--body); padding: 0; }
  .tb.on { background: rgba(255, 255, 255, .22); border-color: var(--c); }
  .tb.held { filter: brightness(1.5); }
  .fire { right: calc(16px * var(--s)); bottom: calc(var(--edge) + 50px * var(--s)); width: calc(86px * var(--s)); height: calc(86px * var(--s)); background: rgba(255, 74, 61, .34); font-size: 14px; }
  .jump { right: calc(112px * var(--s)); bottom: calc(var(--edge) + 36px * var(--s)); width: calc(54px * var(--s)); height: calc(54px * var(--s)); }
  .slide { right: calc(172px * var(--s)); bottom: calc(var(--edge) + 62px * var(--s)); width: calc(52px * var(--s)); height: calc(52px * var(--s)); }
  .zoom { right: calc(116px * var(--s)); bottom: calc(var(--edge) + 102px * var(--s)); width: calc(50px * var(--s)); height: calc(50px * var(--s)); }
  .reload { right: calc(34px * var(--s)); bottom: calc(var(--edge) + 146px * var(--s)); width: calc(50px * var(--s)); height: calc(50px * var(--s)); }
  body.tablet .tb { font-size: 13px; }
  .boost { position: absolute; left: 50%; top: calc(50% + 40px); transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 2px 9px;
    font-family: var(--body); font-weight: 700; font-size: 11px; color: #1a1208; background: #ffd447; border-radius: 999px; }
  .boost .bar { width: 50px; height: 4px; background: rgba(26, 18, 8, .25); }
  .boost .bar i { display: block; height: 100%; background: #1a1208; }

  .panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px 16px calc(var(--edge) + 14px);
    background: rgba(8, 11, 15, .82); pointer-events: auto; overflow-y: auto; }
  .pin { width: min(380px, 100%); display: grid; gap: 10px; }
  .eyebrow { font-weight: 700; font-size: 11px; letter-spacing: .16em; color: var(--c); }
  .ptitle { margin: 0; font-family: var(--display); font-weight: 800; font-size: 50px; line-height: .84; }
  .ptitle span { color: var(--c); display: block; }
  .ptext { margin: 0; font-size: 13px; line-height: 1.65; color: #cfc9bc; }
  .pstats { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 4px 22px; font-family: var(--mono); }
  .pstats .big { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; }
  .prow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .ready { font-family: var(--body); font-weight: 700; font-size: 17px; letter-spacing: .08em; background: var(--c); color: #12100a; border: 1px solid var(--c);
    border-radius: 2px; padding: 12px 26px; cursor: pointer; touch-action: manipulation; }
  .ready.wait { background: transparent; color: var(--c); }
  .ready:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .sens { display: grid; gap: 4px; font-weight: 700; font-size: 11px; color: var(--muted); }
  .sens input { width: 130px; accent-color: var(--c); touch-action: pan-x; }
  .pnote { margin: 0; font-size: 12px; color: var(--c); min-height: 1em; }
  .keys { margin: 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
  body.touch .keys { display: none; }
  .back { justify-self: start; font-size: 12px; font-weight: 700; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }

  .pause { position: fixed; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; z-index: 3;
    border: 1px solid var(--line); background: rgba(12, 16, 22, .8); color: var(--ink); font: 700 12px/1 var(--mono); padding: 0; touch-action: manipulation; }
  /* ---------- 遊び方の選択と、2台でつなぐ画面（向かい合わせではなく、普通の向き） ---------- */
  .sheet { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; overflow-y: auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
  .sbox { width: min(420px, 100%); display: grid; gap: 12px; }
  .stitle { margin: 0; font-family: var(--display); font-weight: 800; font-size: 56px; line-height: .84; }
  .stitle span { color: var(--p1); display: block; }
  .stitle2 { margin: 0; font-family: var(--body); font-weight: 700; font-size: 22px; line-height: 1.35; }
  .stext { margin: 0; font-size: 14px; line-height: 1.7; color: #cfc9bc; }
  .sbtn { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border-radius: 6px; border: 1px solid var(--line); background: rgba(236, 230, 216, .06);
    color: var(--ink); font: 700 18px var(--body); cursor: pointer; touch-action: manipulation; }
  .sbtn small { font-size: 12px; font-weight: 400; color: var(--muted); line-height: 1.5; }
  .sbtn.main { background: var(--p1); color: #12100a; border-color: var(--p1); }
  .sbtn.main small { color: #3d2a08; }
  .sbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .nbtns { display: grid; gap: 10px; }
  .qr { justify-self: center; padding: 12px; background: #fff; border-radius: 8px; }
  .qr img { display: block; width: min(76vw, 340px); height: auto; image-rendering: pixelated; }
  #nVideo { justify-self: center; width: min(80vw, 360px); aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #000; border: 2px solid var(--p2); }
  .codebox { display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
  .codebox summary { cursor: pointer; }
  .codebox textarea { width: 100%; min-height: 64px; resize: vertical; font: 12px/1.4 var(--mono); color: var(--ink); background: rgba(236, 230, 216, .06);
    border: 1px solid var(--line); border-radius: 4px; padding: 8px; -webkit-user-select: text; user-select: text; }
  .codebox .row2 { display: flex; gap: 8px; }
  .mini { font: 700 13px var(--body); padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  #nText { white-space: pre-line; }
  .nnote { margin: 0; font-size: 12px; color: var(--p1); min-height: 1em; }
  /* 2台で遊ぶときは、自分の画面だけを全画面・普通の向きで出す */
  body.online .half { display: none; }
  body.online .half.local { display: block; top: 0; bottom: 0; height: auto; transform: none; --edge: env(safe-area-inset-bottom, 0px); }
  body.online .seam { display: none; }
  body.online .pause { top: calc(12px + env(safe-area-inset-top, 0px)); margin-top: 0; }
  #rotate { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; text-align: center; gap: 8px; padding: 24px; background: var(--bg); font-size: 15px; line-height: 1.7; }
  #rotate b { font-family: var(--display); font-weight: 800; font-size: 36px; color: var(--p1); }
  @media (max-height: 640px) {
    .ptitle { font-size: 38px; }
    .ptitle span { display: inline; }
    .ptext { font-size: 12px; }
    .ready { padding: 9px 20px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { .banner.show { animation-duration: .01s; opacity: 1; } }
</style>
</head>
<body>
<div id="game"></div>
<section class="half p2" id="half1" aria-label="ミント（奥側）の画面"></section>
<section class="half p1" id="half0" aria-label="オレンジ（手前側）の画面"></section>
<div class="seam"></div>
<button class="pause" id="pauseBtn" type="button" aria-label="一時停止" hidden>II</button>
<div class="sheet" id="modeSel">
  <div class="sbox">
    <div class="eyebrow" style="color:var(--p1)">2 PLAYERS · FPS</div>
    <h1 class="stitle">HOLLOW<span>DUEL</span></h1>
    <p class="stext">どうやって遊ぶ？</p>
    <div class="nbtns">
      <button class="sbtn main" id="mOne" type="button">1台で遊ぶ<small>スマホを机に置いて向かい合い、上下に分かれた画面で対戦</small></button>
      <button class="sbtn" id="mTwo" type="button">2台で遊ぶ<small>それぞれ自分のスマホで。QRコードを読み取り合ってつなぐ（同じWi-Fiで）</small></button>
    </div>
    <a class="back" href="index.html" style="color:var(--muted)">← ゲーム選択にもどる</a>
  </div>
</div>
<div class="sheet" id="netSheet" hidden>
  <div class="sbox">
    <div class="eyebrow" style="color:var(--p2)" id="nEye">2台で遊ぶ</div>
    <h2 class="stitle2" id="nTitle"></h2>
    <p class="stext" id="nText"></p>
    <div class="qr" id="nQR" hidden></div>
    <video id="nVideo" playsinline muted hidden></video>
    <div class="nbtns" id="nBtns"></div>
    <details class="codebox" id="nCodeBox" hidden>
      <summary>QRが使えないとき（コードで送る）</summary>
      <div id="nMine"><textarea id="nCode" readonly aria-label="自分のコード"></textarea><div class="row2"><button class="mini" id="nCopy" type="button">コードをコピー</button></div></div>
      <div id="nTheirs"><textarea id="nPaste" placeholder="相手から届いたコードを貼り付け" aria-label="相手のコード"></textarea><div class="row2"><button class="mini" id="nPasteGo" type="button">このコードでつなぐ</button></div></div>
    </details>
    <p class="nnote" id="nNote" aria-live="polite"></p>
  </div>
</div>
<div id="rotate" hidden><b>縦向きで</b>スマホを縦にして机に置き、<br>2人で向かい合って遊んでね。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const V3 = THREE.Vector3;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  try {
    await Promise.race([
      Promise.all([document.fonts.load('800 40px "Big Shoulders Stencil Display"', '0123456789BASE'), document.fonts.load('16px "IBM Plex Mono"', 'LIVE')]),
      new Promise(r => setTimeout(r, 1500))
    ]);
  } catch (e) {}

  // ---------- Constants ----------
  const HALF = 28, WALL_H = 6, EYE = 1.62, PR = .45, MAG = 30, RELOAD = 1.35, FIRE_INT = .11;
  const GOAL = 5, RESPAWN = 2.5, INV = 1.5, DMG_BODY = 14, DMG_HEAD = 34;
  const COLORS = [0xffae3b, 0x55e0b8], NAMES = ['オレンジ', 'ミント'];

  // ---------- Renderer & scenes ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  // 2画面ぶん描くので、画面全体で約220万画素までに抑える（iPad の大画面対策）
  const pixelRatio = () => Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2, Math.sqrt(2.2e6 / (innerWidth * innerHeight)));
  renderer.setPixelRatio(pixelRatio());
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.autoClear = false;
  $('game').appendChild(renderer.domElement);
  const canvas = renderer.domElement;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1319);
  scene.fog = new THREE.Fog(0x0e1319, 25, 80);
  const gunScene = new THREE.Scene();
  gunScene.add(new THREE.HemisphereLight(0xcfd8e3, 0x2a2016, 0.85));
  const gunKey = new THREE.DirectionalLight(0xffd8a0, 0.9); gunKey.position.set(1, 2, 1); gunScene.add(gunKey);

  // ---------- Textures ----------
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  function canvasTex(w, h, draw, rx = 1, ry = 1) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx, ry); t.anisotropy = maxAniso;
    return t;
  }
  function speckle(g, w, h, n, alpha) {
    for (let i = 0; i < n; i++) {
      const v = (Math.random() * 255) | 0;
      g.fillStyle = `rgba(${v},${v},${v},${Math.random() * alpha})`;
      g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
  }
  const floorTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#272d34'; g.fillRect(0, 0, w, h); speckle(g, w, h, 7000, .08);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 1;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
  }, 7, 7);
  const wallTex = canvasTex(512, 256, (g, w, h) => {

  }
  async function hostStart() {
    net.role = 'host';
    netStep({ title: '部屋を準備しています…' });
    try {
      const pc = newPC();
      setupDC(pc.createDataChannel('duel', { ordered: true }));
      await pc.setLocalDescription(await pc.createOffer());
      await gathered(pc);
      net.offer = pack(pc.localDescription.sdp, 'o');
      hostShow();
    } catch (e) { netFail(e); }
  }
  function hostShow() {
    netStep({ title: '① 相手にこのQRを読み取ってもらう', text: 'もう1台で「2台で遊ぶ」→「部屋に入る」を押して、このQRを写してもらってね。\n相手の画面に返事のQRが出たら、下のボタンへ。',
      qr: net.offer, theirs: true, onCode: hostGotAnswer, btns: [['② 相手のQRを読み取る', hostScan, true], ['やめる', netChoose]] });
  }
  function hostScan() {
    netStep({ title: '② 相手のQRを読み取る', text: '相手の画面に出ている返事のQRを、カメラに写してね。', scan: true, theirs: true, onCode: hostGotAnswer,
      btns: [['①のQRにもどる', hostShow]] });
  }
  function hostGotAnswer(code) {
    const r = tryUnpack(code, 'a');
    if (!r) return false;
    netStep({ title: 'つないでいます…', text: 'すぐに始まります。' });
    net.pc.setRemoteDescription({ type: 'answer', sdp: r.sdp }).catch(netFail);
    clearTimeout(net.timer); net.timer = setTimeout(() => { if (!online) netFail(new Error('timeout')); }, 15000);
    return true;
  }
  function guestStart() {
    net.role = 'guest'; closePC();
    netStep({ title: '① 部屋のQRを読み取る', text: '部屋を作った人の画面に出ているQRを、カメラに写してね。', scan: true, theirs: true, onCode: guestGotOffer,
      btns: [['もどる', netChoose]] });
  }
  function guestGotOffer(code) {
    const r = tryUnpack(code, 'o');
    if (!r) return false;
    netStep({ title: '返事を準備しています…' });
    (async () => {
      const pc = newPC();
      pc.ondatachannel = e => setupDC(e.channel);
      await pc.setRemoteDescription({ type: 'offer', sdp: r.sdp });
      await pc.setLocalDescription(await pc.createAnswer());
      await gathered(pc);
      if (online) return;
      const ans = pack(pc.localDescription.sdp, 'a');
      netStep({ title: '② この返事のQRを相手に読み取ってもらう', text: '相手が「② 相手のQRを読み取る」でこのQRを写すと、自動でつながります。', qr: ans,
        btns: [['最初からやり直す', netChoose]] });
    })().catch(netFail);
    return true;
  }
  function netFail(e) {
    if (online) return;
    if (e) console.warn(e);
    closePC();
    netStep({ title: 'つながりませんでした',
      text: '次のような場合はつながらないことがあります。\n・2台が別々のWi-Fiにつながっている（片方がモバイル通信のときも）\n・会社や学校、お店のゲスト用Wi-Fiで、端末どうしの通信が止められている\n片方のスマホのテザリング（インターネット共有）に、もう片方をつなぐと、つながりやすくなります。',
      btns: [['もう一度', netChoose, true], ['1台で遊ぶ', () => { $('netSheet').hidden = true; }]] });
  }
  $('mOne').addEventListener('click', () => { $('modeSel').hidden = true; });
  $('mTwo').addEventListener('click', netChoose);

  // ---------- Input: touch ----------
  // 上半分（奥側の人）は画面が180°回っているので、指の動きの向きも反転して扱う
  const flipOf = p => p.i && !online ? -1 : 1;
  const canLook = () => phase === 'playing' || phase === 'countdown';
  const canAct = () => phase === 'playing';
  const lookTouches = new Map();
  const playerAtY = y => online ? me() : y < innerHeight / 2 ? players[1] : players[0];
  function setStick(p, t) {
    const s = flipOf(p), max = 46 * (document.body.classList.contains('tablet') ? 1.25 : 1);
    let dx = (t.clientX - p.stick.cx) * s, dy = (t.clientY - p.stick.cy) * s;
    const d = Math.hypot(dx, dy); if (d > max) { dx *= max / d; dy *= max / d; }
    p.stick.x = dx / max; p.stick.y = dy / max;
    p.ui.knob.style.transform = `translate(${dx}px,${dy}px)`;
  }
  for (const p of players) {
    const u = p.ui;
    u.stick.addEventListener('touchstart', e => {
      e.preventDefault(); const t = e.changedTouches[0], r = u.stick.getBoundingClientRect();
      p.stick.id = t.identifier; p.stick.active = canAct(); p.stick.cx = r.left + r.width / 2; p.stick.cy = r.top + r.height / 2;
      setStick(p, t);
    }, { passive: false });
    u.fire.addEventListener('touchstart', e => {
      e.preventDefault(); const t = e.changedTouches[0];
      lookTouches.set(t.identifier, { p, x: t.clientX, y: t.clientY, fire: true });
      p.firing = canAct() && !p.dead; u.fire.classList.add('held');
    }, { passive: false });
    const tb = (el, fn) => el.addEventListener('touchstart', e => { e.preventDefault(); if (canAct() && !p.dead) fn(); }, { passive: false });
    tb(u.jump, () => { p.jumpQ = true; });
    tb(u.slide, () => startSlide(p));
    tb(u.reload, () => startReload(p));
    tb(u.zoom, () => { p.aiming = !p.aiming; u.zoom.classList.toggle('on', p.aiming); });
    u.ready.addEventListener('click', () => pressReady(p));
  }
  // 自分の画面の左側（奥の人は画面の右側）を触ったら、その場所にスティックを出す
  function floatStick(p, t) {
    const half = p.el.getBoundingClientRect(), st = p.ui.stick, size = st.offsetWidth;
    const fl = flipOf(p) < 0;
    const lx = fl ? half.right - t.clientX : t.clientX - half.left, ly = fl ? half.bottom - t.clientY : t.clientY - half.top;
    st.classList.add('float'); st.style.left = (lx - size / 2) + 'px'; st.style.top = (ly - size / 2) + 'px'; st.style.bottom = 'auto';
    p.stick.id = t.identifier; p.stick.active = true; p.stick.cx = t.clientX; p.stick.cy = t.clientY; setStick(p, t);
  }
  function resetStick(p) {
    const st = p.ui.stick; st.classList.remove('float'); st.style.left = st.style.top = st.style.bottom = '';
    p.stick.id = null; p.stick.active = false; p.stick.x = p.stick.y = 0; p.ui.knob.style.transform = '';
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = playerAtY(t.clientY), leftSide = flipOf(p) < 0 ? t.clientX > innerWidth * .58 : t.clientX < innerWidth * .42;
      if (canAct() && !p.dead && p.stick.id === null && leftSide) { floatStick(p, t); continue; }
      lookTouches.set(t.identifier, { p, x: t.clientX, y: t.clientY });
    }
  }, { passive: false });
  addEventListener('touchmove', e => {
    if (canLook()) e.preventDefault();
    for (const t of e.changedTouches) {
      const sp = players.find(p => p.stick.id === t.identifier);
      if (sp) { if (canAct()) { sp.stick.active = true; setStick(sp, t); } continue; }
      const L = lookTouches.get(t.identifier);
      if (!L) continue;
      const s = flipOf(L.p);
      if (canLook() && !L.p.dead) look(L.p, (t.clientX - L.x) * 1.25 * s, (t.clientY - L.y) * 1.25 * s);
      L.x = t.clientX; L.y = t.clientY;
    }
  }, { passive: false });
  const endTouch = e => {
    for (const t of e.changedTouches) {
      for (const p of players) if (p.stick.id === t.identifier) resetStick(p);
      const L = lookTouches.get(t.identifier);
      if (L && L.fire) { L.p.firing = false; L.p.ui.fire.classList.remove('held'); }
      lookTouches.delete(t.identifier);
    }
  };
  addEventListener('touchend', endTouch); addEventListener('touchcancel', endTouch);

  // ---------- Input: keyboard (PCで試すとき用) ----------
  const KEYMAP = {
    KeyW: [0, 'f'], KeyS: [0, 'b'], KeyA: [0, 'l'], KeyD: [0, 'r'], KeyQ: [0, 'tl'], KeyE: [0, 'tr'], KeyF: [0, 'fire'],
    KeyI: [1, 'f'], KeyK: [1, 'b'], KeyJ: [1, 'l'], KeyL: [1, 'r'], KeyU: [1, 'tl'], KeyO: [1, 'tr'], KeyH: [1, 'fire']
  };
  addEventListener('keydown', e => {
    const m = KEYMAP[e.code];
    if (m) { players[online ? localIdx : m[0]].keys[m[1]] = canAct(); return; }
    if (!canAct()) { if (e.code === 'Escape') pause(); return; }
    const P0 = players[online ? localIdx : 0], P1 = players[online ? localIdx : 1];
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) P0.jumpQ = true; }
    if (e.code === 'KeyB' && !e.repeat) P1.jumpQ = true;
    if (e.code === 'KeyR') startReload(P0);
    if (e.code === 'KeyY') startReload(P1);
    if (e.code === 'KeyG' && !e.repeat) startSlide(P0);
    if (e.code === 'KeyN' && !e.repeat) startSlide(P1);
    if (e.code === 'Escape' || e.code === 'KeyP') pause();
  });
  addEventListener('keyup', e => { const m = KEYMAP[e.code]; if (m) players[online ? localIdx : m[0]].keys[m[1]] = false; });

  $('pauseBtn').addEventListener('click', () => pause());
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  function onResize() {
    document.body.classList.toggle('tablet', isTouch && Math.min(innerWidth, innerHeight) >= 700);
    renderer.setPixelRatio(pixelRatio());
    renderer.setSize(innerWidth, innerHeight);
    for (const p of players) { p.cam.aspect = p.gunCam.aspect = innerWidth / (online ? innerHeight : innerHeight / 2); p.cam.updateProjectionMatrix(); p.gunCam.updateProjectionMatrix(); }
    const sideways = isTouch && !online && innerWidth > innerHeight && innerHeight < 520;
    $('rotate').hidden = !sideways;
    if (sideways) pause();
  }
  addEventListener('resize', onResize);

  // ---------- Render ----------
  // 1つのシーンを上下2回に分けて描く。自分の体は自分の画面には出さない
  function renderAll() {
    const W = innerWidth, H = innerHeight, h = H / 2;
    if (online) {
      const p = me(), f = foeOf(p);
      renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
      p.model.g.visible = false;
      f.model.g.visible = !f.dead && (f.invT <= 0 || Math.floor(performance.now() / 100) % 2 === 0);
      renderer.clear(); renderer.render(scene, p.cam);
      renderer.clearDepth(); p.gun.visible = !p.dead; f.gun.visible = false;
      renderer.render(gunScene, p.gunCam);
      return;
    }
    renderer.setScissorTest(true);
    for (const p of players) {
      const f = foeOf(p), y = p.i ? h : 0;
      renderer.setViewport(0, y, W, h); renderer.setScissor(0, y, W, h);
      p.model.g.visible = false;
      f.model.g.visible = !f.dead && (f.invT <= 0 || Math.floor(gt * 10) % 2 === 0);
      renderer.clear();
      renderer.render(scene, p.cam);
      renderer.clearDepth();
      p.gun.visible = !p.dead; f.gun.visible = false;
      renderer.render(gunScene, p.gunCam);
    }
    renderer.setScissorTest(false);
  }

  // ---------- Loop ----------
  newMatch();
  onResize();
  updatePanels();
  let last = performance.now();
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (phase === 'playing') {
      gt += dt;
      for (const p of players) { if (isRemote(p)) updateRemote(p, dt); else updatePlayer(p, dt); }
      if (!online) separatePlayers();
      updatePickups(dt);
      updateDrops(dt);
    } else {
      if (phase === 'countdown') updateCountdown(dt);
      for (const p of players) { if (isRemote(p)) updateRemote(p, dt); else placeCamera(p, dt); }
    }
    updateEffects(dt);
    updateReferee(dt);
    for (const p of players) { animateGun(p, dt); if (!isRemote(p)) updateHUD(p); }
    renderAll();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
