<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pop.css?v=1">
<style>
  body.pop { touch-action: none; }
  #cv { display: block; width: 100cqw; height: 100cqh; touch-action: none; cursor: pointer; }
</style>
</head>
<body class="pop">
<header class="pop-top">
  <a class="pop-back" href="index.html" aria-label="ゲーム選択へ">←</a>
  <h1 class="pop-title">STACK</h1>
  <div class="pop-chips"><div class="pop-chip"><span>SCORE</span><b id="score">0</b></div><div class="pop-chip"><span>BEST</span><b id="best">0</b></div></div>
</header>
<main class="pop-stage"><canvas id="cv" class="pop-card" aria-label="ブロックを積むエリア。タップで落とす"></canvas></main>
<script src="pop.js?v=1"></script>
<script>
(() => {
  'use strict';
  const { sfx, buzz, store, dialog, toast, confetti, isOpen } = Pop;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const COLORS = ['#ff5f9e', '#ffd447', '#70e1b2', '#4d96ff', '#ff934f', '#8b5cf6'];
  const INK = '#25213b';
  let W = 360, H = 600, dpr = 1, k = 1, BH = 28, BW = 220, groundY = 560;
  let tower = [], mv = null, debris = [], rings = [], stars = [];
  let state = 'ready', camY = 0, camT = 0, combo = 0, maxCombo = 0, perfects = 0, shake = 0, last = performance.now();
  let best = store.get('stack.best', 0);
  document.getElementById('best').textContent = best;

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    k = Math.min(W / 360, H / 560); BH = Math.round(30 * k); BW = W * .6; groundY = H - 46 * k;
    stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .6 }));
    if (state !== 'play') reset();
  }
  function reset() {
    tower = [{ x: (W - BW) / 2, w: BW, c: COLORS[0] }];
    mv = null; debris = []; rings = []; camY = camT = 0; combo = maxCombo = perfects = 0;
    setScore(0);
  }
  function setScore(n) { document.getElementById('score').textContent = n; }
  const rowY = i => groundY - (i + 1) * BH;  // i 段目の上端（カメラ補正前）
  function spawn() {
    const top = tower[tower.length - 1], n = tower.length;
    const dir = n % 2 ? 1 : -1;
    mv = { x: dir > 0 ? -top.w * .4 : W - top.w * .6, w: top.w, dir, c: COLORS[n % COLORS.length] };
  }
  function start() { reset(); state = 'play'; spawn(); last = performance.now(); }
  function place() {
    if (state !== 'play' || !mv) return;
    const top = tower[tower.length - 1], n = tower.length, y = rowY(n);
    const tol = Math.max(3, 5 * k);
    let nx, nw;
    if (Math.abs(mv.x - top.x) <= tol) {
      // ぴったり：幅を保ったまま。3回続くと少し広がる
      nx = top.x; nw = top.w; combo++; perfects++; maxCombo = Math.max(maxCombo, combo);
      if (combo >= 3 && nw < BW) { const g = Math.min(BW - nw, 10 * k); nx -= g / 2; nw += g; }
      rings.push({ x: nx, w: nw, y, t: 0 });
      sfx.pop(1 + Math.min(combo, 10) * .07); buzz(15);
      if (combo >= 2) toast(`PERFECT ×${combo}`, 'white');
    } else {
      const left = Math.max(mv.x, top.x), right = Math.min(mv.x + mv.w, top.x + top.w);
      if (right - left <= 0) return gameOver();
      // はみ出した部分は切り落として落とす
      const cut = mv.x < top.x ? { x: mv.x, w: top.x - mv.x } : { x: top.x + top.w, w: mv.x + mv.w - (top.x + top.w) };
      debris.push({ x: cut.x, y, w: cut.w, vx: (mv.x < top.x ? -1 : 1) * 60 * k, vy: 0, rot: 0, vr: (mv.x < top.x ? -1 : 1) * 2, c: mv.c });
      nx = left; nw = right - left; combo = 0;
      sfx.place(1 + Math.min(n, 60) * .01);
    }
    tower.push({ x: nx, w: nw, c: mv.c });
    setScore(tower.length - 1);
    camT = Math.max(0, (tower.length - (H / BH) * .55) * BH);
    spawn();
  }
  function gameOver() {
    state = 'over';
    debris.push({ x: mv.x, y: rowY(tower.length), w: mv.w, vx: mv.dir * 80 * k, vy: 0, rot: 0, vr: mv.dir * 2.5, c: mv.c });
    mv = null; shake = .35; sfx.bad(); buzz([60, 40, 100]);
    const score = tower.length - 1, newBest = score > best;
    if (newBest) { best = score; store.set('stack.best', best); document.getElementById('best').textContent = best; }
    setTimeout(() => {
      if (newBest && score > 0) { confetti(); sfx.win(); }
      dialog({
        eyebrow: newBest && score > 0 ? '自己ベスト更新！' : 'GAME OVER', title: `${score} 段`,
        text: score >= 50 ? '雲の上まで届きました。' : score >= 25 ? 'かなり高くなりました！' : 'ぴったり重ねると、幅が減りません。',
        stats: [['スコア', score, newBest], ['ベスト', best], ['最大コンボ', maxCombo], ['PERFECT', perfects]],
        buttons: [{ label: 'もう一回', on: start }, { label: 'ゲーム選択へ', ghost: true, on: () => { location.href = 'index.html'; } }]
      });
    }, 900);
  }
  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = s => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }
  // 高くなるほど、昼 → 夕方 → 夜 と空の色が変わる
  const SKY = [['#95e7f4', '#d6f5ff'], ['#ff9fc4', '#ffe28a'], ['#8b5cf6', '#ff934f'], ['#25213b', '#4b3f8f']];
  function skyAt(h) {
    const p = Math.min(SKY.length - 1.001, h / 25), i = Math.floor(p), t = p - i;
    return [mix(SKY[i][0], SKY[i + 1][0], t), mix(SKY[i][1], SKY[i + 1][1], t), Math.max(0, p - 2)];
  }
  function block(x, y, w, c) {
    ctx.fillStyle = c; ctx.fillRect(x, y, w, BH);
    ctx.fillStyle = 'rgba(255,255,255,.38)'; ctx.fillRect(x + 3, y + 3, Math.max(0, w - 6), BH * .22);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, BH);
  }
  function draw() {
    const h = tower.length - 1, [top, bot, night] = skyAt(h);
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (night > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, night)})`; for (const s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); } }
    ctx.save();
    const sx = shake > 0 ? (Math.random() - .5) * 10 * shake : 0;
    ctx.translate(sx, camY);
    ctx.fillStyle = '#fffaf0'; ctx.fillRect(W * .12, groundY, W * .76, H);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(W * .12, groundY, W * .76, H);
    tower.forEach((b, i) => block(b.x, rowY(i), b.w, b.c));
    for (const r of rings) {
      ctx.strokeStyle = `rgba(255,255,255,${1 - r.t})`; ctx.lineWidth = 4;
      const e = r.t * 16 * k; ctx.strokeRect(r.x - e, r.y - e, r.w + e * 2, BH + e * 2);
    }
    if (mv) block(mv.x, rowY(tower.length), mv.w, mv.c);
    for (const d of debris) {
      ctx.save(); ctx.translate(d.x + d.w / 2, d.y + BH / 2); ctx.rotate(d.rot); block(-d.w / 2, -BH / 2, d.w, d.c); ctx.restore();
    }
    ctx.restore();
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    if (state === 'play' && mv && !isOpen()) {
      const v = Math.min(430, 150 + 7 * (tower.length - 1)) * k;
      mv.x += mv.dir * v * dt;
      if (mv.x > W - mv.w * .55) { mv.x = W - mv.w * .55; mv.dir = -1; }
      if (mv.x < -mv.w * .45) { mv.x = -mv.w * .45; mv.dir = 1; }
    }
    camY += (camT - camY) * Math.min(1, dt * 6);
    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i]; d.vy += 1400 * k * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      if (d.y + camY > H + 200) debris.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt * 2.5; if (rings[i].t >= 1) rings.splice(i, 1); }
    shake = Math.max(0, shake - dt);
    draw();
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (!isOpen()) place(); });
  addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !isOpen()) { e.preventDefault(); place(); } });
  new ResizeObserver(size).observe(cv);
  size();
  requestAnimationFrame(frame);
  dialog({
    eyebrow: '1 PLAYER', title: 'STACK',
    text: '左右に動くブロックを、タップで落として積み上げよう。はみ出した分は切り落とされて、だんだん細くなります。ぴったり重ねると幅はそのまま、3回続くと少し広がります。',
    stats: [['ベスト', best]],
    buttons: [{ label: 'スタート', on: start }]
  });
})();
</script>
</body>
</html>
